<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperscaler DC Build</title>
<style>
/*__FONT__*/
:root{
  color-scheme:light;
  --plane:#f4f6f9; --surf:#fff; --surf2:#f7f9fb; --ink:#192b40; --ink2:#536478; --muted:#66788a; --grid:#e7edf3; --border:#dfe6ee;
  --accent:#147d71; --link:#2f6fbf; --shadow:0 3px 16px #20334a08;
  --st-fill:#e4e9ef; --st-line:#ffffff; --st-hl:#ccd6e1;
  --g-base:#c3cdd8; --g-op:#6c7d8f; --g-uc:#3778c9; --g-dl:#d0703a; --g-aH:#6a4fc7; --g-aM:#9c88e3; --g-aL:#cbbff2;
  --c-amzn:#d08a2a; --c-goog:#1f9a7a; --c-meta:#5b6ee0; --c-msft:#c0507e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --plane:#111c29; --surf:#182636; --surf2:#1c2c3e; --ink:#e6edf5; --ink2:#b3c0cf; --muted:#94a7bc; --grid:#293a4d; --border:#304258;
    --accent:#70cfbe; --link:#7fb0ee; --shadow:none;
    --st-fill:#22344a; --st-line:#111c29; --st-hl:#36506d;
    --g-base:#4d6075; --g-op:#94a7bc; --g-uc:#72a6ea; --g-dl:#e58a52; --g-aH:#b3a3f8; --g-aM:#7d68d2; --g-aL:#4a3d8f;
    --c-amzn:#e6a74e; --c-goog:#4fc3a1; --c-meta:#8b9cf5; --c-msft:#e183a8;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#111c29; --surf:#182636; --surf2:#1c2c3e; --ink:#e6edf5; --ink2:#b3c0cf; --muted:#94a7bc; --grid:#293a4d; --border:#304258;
  --accent:#70cfbe; --link:#7fb0ee; --shadow:none;
  --st-fill:#22344a; --st-line:#111c29; --st-hl:#36506d;
  --g-base:#4d6075; --g-op:#94a7bc; --g-uc:#72a6ea; --g-dl:#e58a52; --g-aH:#b3a3f8; --g-aM:#7d68d2; --g-aL:#4a3d8f;
  --c-amzn:#e6a74e; --c-goog:#4fc3a1; --c-meta:#8b9cf5; --c-msft:#e183a8;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--plane);color:var(--ink);font:14px/1.55 "OR Jakarta","Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--link);text-underline-offset:3px}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:fixed;left:250px;top:-100px;z-index:100;background:var(--surf);color:var(--ink);padding:10px 16px;border-radius:6px}
.skip:focus{top:12px}
/* shell: same look as the dashboards hub (navy sidebar, white top bar) */
.side{position:fixed;inset:0 auto 0 0;width:232px;background:#11263b;color:#e9eff6;display:flex;flex-direction:column;padding:26px 14px 18px;z-index:60;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 24px;color:#fff;text-decoration:none;font-size:13px;font-weight:750;letter-spacing:1.8px;line-height:1.35}
.brand-mark{display:grid;place-items:center;width:32px;height:36px;border:1px solid #4b7b87;border-radius:7px;color:#8ed3c3;font-size:21px;font-weight:500;flex:none}
.brand small{display:block;font-size:7px;letter-spacing:1.1px;color:#a3b6c9;margin-top:4px}
.ng{margin:0 0 18px}
.ng>p{margin:0 10px 6px;color:#8ca6bd;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;white-space:nowrap}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;margin:1px 0;color:#b9c9d8;border-radius:6px;text-decoration:none;font-size:12px;line-height:1.35}
.nav a:hover{background:#ffffff0d;color:#fff}
.nav a[aria-current=page]{background:#244557;color:#fff;box-shadow:inset 3px 0 #77cbb8}
.nav .nv{margin-left:auto;font-size:10.5px;color:#8ca6bd;font-variant-numeric:tabular-nums;white-space:nowrap}
.nav a[aria-current=page] .nv{color:#bfe6dc}
.nav .nd{width:7px;height:7px;border-radius:50%;flex:none}
.side-foot{margin-top:auto;border-top:1px solid #ffffff16;padding:14px 10px 0;font-size:10px;color:#c1d1df;line-height:1.65}
.side-foot b{color:#fff;font-weight:600}
.side-foot a{display:block;margin-top:8px;color:#a9bfd1;text-decoration:none}
.side-foot a:hover{color:#fff}
.dot-live{width:6px;height:6px;background:#7bc6b3;display:inline-block;border-radius:50%;margin-right:7px}
.work{margin-left:232px;min-width:0}
.top{position:sticky;top:0;z-index:45;display:flex;align-items:center;gap:24px;min-height:82px;padding:14px 36px;background:var(--surf);border-bottom:1px solid var(--border)}
.top .crumb{color:var(--muted);font-size:9px;letter-spacing:1.5px;font-weight:650;margin:0 0 2px;text-transform:uppercase}
.top h1{margin:0;font-size:19px;letter-spacing:-.4px;font-weight:650;line-height:1.35;white-space:nowrap}
.srch{position:relative;flex:1;max-width:520px;margin-left:auto}
.srch input{width:100%;font-size:13.5px;padding:10px 14px 10px 38px;border:1px solid var(--border);border-radius:9px;background:var(--plane);color:var(--ink)}
.srch input:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--surf)}
.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surf);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px #10223826;z-index:30;max-height:460px;overflow:auto}
.dd .it{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--grid)}
.dd .it:last-child{border-bottom:0}
.dd .it[aria-selected="true"],.dd .it:hover{background:var(--surf2)}
.dd .it b{font-weight:650}
.dd .it .gw{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12px;text-align:right}
.dd .it .r{grid-column:1/-1;font-size:11px;color:var(--muted)}
.dd .none{padding:12px 14px;color:var(--muted);font-size:12.5px}
.top-act{display:flex;align-items:center;gap:18px}
.asof{font-size:10px;color:var(--muted);text-align:right;white-space:nowrap}
.asof b{display:block;font-size:12px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.theme{display:grid;place-items:center;width:36px;height:36px;background:var(--plane);border:1px solid var(--border);border-radius:8px;color:var(--ink2);cursor:pointer;flex:none}
.theme svg{width:16px;height:16px}
main{max-width:1440px;margin:0 auto;padding:30px 36px 70px;outline:none}
/* view furniture */
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 32px;margin:0 0 18px}
.kick{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:750;color:var(--accent);margin:0 0 6px}
.vhead h2{margin:0;font-size:28px;font-weight:650;letter-spacing:-.8px;line-height:1.2}
.vhead h2 small{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:10px}
.vsub{margin:6px 0 0;color:var(--ink2);font-size:12.5px}
.vright{max-width:540px;font-size:12px;color:var(--ink2);line-height:1.65}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 16px}
.toolbar .btn{margin-left:auto}
.lbl{font-size:10px;font-weight:650;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--plane);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:4px 12px;font-size:12px;border-radius:5px;cursor:pointer;line-height:1.5}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surf);color:var(--accent);font-weight:650;box-shadow:0 1px 4px #00000018}
.btn{border:1px solid var(--border);background:var(--surf);color:var(--ink2);border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{color:var(--ink);border-color:var(--muted)}
.btn svg{width:13px;height:13px}
.story{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0;padding:14px 18px;font-size:13px;line-height:1.8;color:var(--ink2);margin:0 0 16px}
.story b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:0 0 16px}
.kpi{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:15px 18px;box-shadow:var(--shadow);min-width:0}
.kpi .kl{display:block;font-size:10px;font-weight:650;letter-spacing:.55px;text-transform:uppercase;color:var(--muted)}
.kpi strong{display:block;font-size:26px;line-height:1.25;letter-spacing:-.8px;font-weight:650;margin:7px 0 4px;font-variant-numeric:tabular-nums}
.kpi strong small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:4px}
.kpi>small{display:block;font-size:11px;color:var(--muted);line-height:1.55}
.kpi.lead{border-color:color-mix(in srgb,var(--accent) 50%,var(--border));background:color-mix(in srgb,var(--accent) 6%,var(--surf))}
.kpi.lead .kl{color:var(--accent)}
.panel{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow);margin:0 0 16px;min-width:0}
.panel h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.2px}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 16px}
.cs{font-size:11.5px;color:var(--muted);margin:3px 0 12px;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11px;color:var(--ink2);margin:0 0 8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.c{border-radius:50%}
.legend i.dash{background:transparent;border:1.5px dashed var(--muted)}
.legend i.hm,.mini span.hm{background:repeating-linear-gradient(135deg,var(--g-aM) 0 2px,color-mix(in srgb,var(--g-aM) 30%,transparent) 2px 4px)}
.chart .medv{fill:var(--muted);font-size:10.5px;font-weight:600}
.hc-med{font-size:11.5px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.hc-med b{color:var(--ink);font-weight:650}
/* the four */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 16px}
.hcard{display:block;background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:16px 18px 14px;color:inherit;text-decoration:none;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:border-color .15s}
.hcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--cc)}
.hcard:hover{border-color:var(--cc)}
.hc-top{display:flex;justify-content:space-between;align-items:baseline}
.hc-name{font-size:15px;font-weight:650}
.hc-tick{font-size:10.5px;color:var(--muted);font-weight:650;letter-spacing:.6px}
.hc-k{font-size:10px;font-weight:650;letter-spacing:.55px;text-transform:uppercase;color:var(--muted);margin-top:10px}
.hc-v{font-size:30px;font-weight:650;letter-spacing:-1px;line-height:1.2;font-variant-numeric:tabular-nums}
.hc-v small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:4px}
.mini{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:10px 0 2px;background:var(--grid)}
.mini span{height:100%;min-width:1px}
.mini span+span{border-left:2px solid var(--surf)}
.hcard dl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:10px 0 0;font-size:12px}
.hcard dt{color:var(--ink2)}
.hcard dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hc-go{display:block;margin-top:12px;padding-top:10px;border-top:1px solid var(--grid);font-size:11.5px;color:var(--link);font-weight:600}
.stk{display:flex;height:22px;border-radius:0 4px 4px 0;overflow:hidden;min-width:2px}
.stk span{display:block;height:100%;min-width:1px}
.stk span+span{border-left:2px solid var(--surf)}
.crow{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin:9px 0}
.crow .nm{font-weight:650;display:flex;align-items:center;gap:7px}
.crow .tv{font-variant-numeric:tabular-nums;font-weight:650;text-align:right}
.nd{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.mult{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.mult h4{margin:0;font-size:13px;display:flex;align-items:center;gap:7px}
.mult .cs{margin:0 0 4px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .val{fill:var(--ink);font-size:12px;font-weight:650}
.chart .gl{stroke:var(--grid);stroke-width:1}
.map svg{width:100%;height:auto;display:block}
.stp{fill:var(--st-fill);stroke:var(--st-line);stroke-width:1}
.stp.hl{fill:var(--st-hl);stroke:var(--muted)}
.map circle{stroke:var(--surf);stroke-width:1.1;fill-opacity:.82}
.map .cs{margin:8px 0 0}
.map path.rg{fill-opacity:.18;stroke-width:2.2;stroke-linejoin:round}
.map path.rgh{fill:none;stroke:var(--surf);stroke-width:5;pointer-events:none}
.map[data-src="at"] .rg,.map[data-src="rg"] .at{display:none}
.legend i.dia{background:transparent;border:2px solid var(--ink2);border-radius:1px;transform:rotate(45deg);width:8px;height:8px;margin:0 7px 0 2px}
/* tables */
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:650;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surf2);z-index:1}
td{padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
tr:hover>td{background:var(--surf2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot>td{font-weight:650;border-top:1px solid var(--border);border-bottom:0;background:transparent}
.tscroll{overflow-x:auto}
.tscroll th{white-space:normal;vertical-align:bottom;line-height:1.3}
.tscroll th,.tscroll td{padding-left:6px;padding-right:6px}
.tscroll td:first-child{min-width:118px}
.tbl-wrap{max-height:560px;overflow:auto;border:1px solid var(--border);border-radius:10px}
.tbl-wrap td:first-child{min-width:170px}
.why{color:var(--muted);font-size:11px}
.db{position:relative}
.db i{position:absolute;right:4px;top:4px;bottom:4px;background:var(--accent);opacity:.16;border-radius:3px}
.db span{position:relative}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font-size:10px;font-weight:650;border:1px solid var(--border);color:var(--ink2);white-space:nowrap;background:var(--surf2)}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 10px}
.filters input{font-size:12.5px;padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:var(--plane);color:var(--ink);min-width:240px}
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:-6px 0 14px;overflow-x:auto}
.tabbar button{border:0;background:transparent;color:var(--muted);padding:9px 14px;font-size:12.5px;font-weight:650;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabbar button:hover{color:var(--ink)}
.tabbar button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.cpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 24px;font-size:12.5px}
.cpl ol{margin:4px 0 0;padding-left:18px}
.cpl li{margin:2px 0}
.cpl .lb{font-size:10px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
a.ent{cursor:pointer;text-decoration:none}
a.ent:hover{text-decoration:underline}
details.note{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:12px;color:var(--ink2);line-height:1.75}
details.note summary{cursor:pointer;font-weight:650}
details.note p{margin:8px 0 0}
.mdl{display:grid;grid-template-columns:190px 1fr;gap:12px 24px;font-size:13px;line-height:1.7;margin:6px 0 0}
.mdl dt{font-weight:650}
.mdl dd{margin:0;color:var(--ink2)}
.xlink{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 20px;text-decoration:none;color:inherit}
.xlink:hover h3{color:var(--link)}
.xlink .go{font-size:12px;font-weight:650;color:var(--link)}
.foot{font-size:11px;color:var(--muted);line-height:1.8;margin:0}
#tip{position:fixed;pointer-events:none;z-index:80;background:var(--surf);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.55;box-shadow:0 10px 30px #10223830;max-width:340px;display:none}
@media (min-width:1021px) and (max-width:1300px){.side{width:204px;padding-left:10px;padding-right:10px}.work{margin-left:204px}main{padding:26px 22px 60px}.top{padding:12px 22px;gap:16px}.asof{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.mult{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1020px){
  .side{position:sticky;top:0;inset:auto;width:auto;height:48px;padding:0 12px;display:block;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .brand,.side-foot,.ng>p,.nav .nv{display:none}
  .nav{display:flex;width:max-content;height:100%;align-items:center;gap:2px}
  .ng{display:contents}
  .nav a{white-space:nowrap;padding:6px 10px;margin:0}
  .nav a[aria-current=page]{box-shadow:inset 0 -2px #77cbb8}
  .work{margin-left:0}
  .top{position:relative;flex-wrap:wrap;padding:14px 18px;gap:12px}
  .srch{order:3;flex-basis:100%;max-width:none;margin:0}
  .top-act{margin-left:auto}
  .grid2{grid-template-columns:1fr}
  .cards,.mult{grid-template-columns:repeat(2,minmax(0,1fr))}
  main{padding:22px 18px 56px}
  .skip{left:16px}
}
@media (max-width:620px){
  main{padding:18px 16px 48px}
  .top{padding:12px 16px}
  .top h1{font-size:16px;white-space:normal}
  .top>div:first-child{flex:1;min-width:0}
  .top .crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .asof{display:none}
  .cards{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 14px}
  .kpi strong{font-size:21px}
  .vhead h2{font-size:23px}
  .panel{padding:16px 14px}
  .crow{grid-template-columns:84px 1fr 52px}
  .mdl{grid-template-columns:1fr;gap:2px 0}
  .mdl dd{margin-bottom:10px}
  .filters input{min-width:0;flex:1}
  .toolbar .btn{margin-left:0}
}
@media print{.side,.srch,.theme,.skip{display:none}.work{margin:0}.top{position:static}.panel,.hcard,.kpi{box-shadow:none;break-inside:avoid}.tbl-wrap{max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the dashboard</a>
<aside class="side">
  <a class="brand" href="index.html" aria-label="Capstone research dashboards"><span class="brand-mark" aria-hidden="true">C</span><span>CAPSTONE<small>RESEARCH INTELLIGENCE</small></span></a>
  <nav class="nav" id="nav" aria-label="Views"></nav>
  <div class="side-foot" id="sideFoot"></div>
</aside>
<div class="work">
  <header class="top">
    <div><p class="crumb" id="crumb">Research / DC build-out</p><h1>Who is building US data centers</h1></div>
    <div class="srch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="coQ" type="search" autocomplete="off" spellcheck="false" placeholder="Search any company or state: OpenAI, Crusoe, ORCL, Texas, US…" aria-label="Search a company or a state in the Aterio census" role="combobox" aria-expanded="false" aria-controls="coList" aria-autocomplete="list">

    kpi("Operating today", gqv(A.g[0]), `${gq(A.base)} before ${Y0} · ${gq(went)} went live in ${Y0}`) +
    kpi(`End-${Y1}, house view`, gqv(end), A.base > 0.5 ? `×${(end / A.base).toFixed(1)} vs end-${Y0 - 1} · ~${Math.round((Math.pow(end / A.base, 1 / (Y1 - Y0 + 1)) - 1) * 100)}% a year` : "") +
    kpi("Under construction", gqv(A.g[1]), `plus delayed ${gq(A.g[2])}`) +
    kpi("Announced, any date", gqv(A.g[3] + A.g[4] + A.g[5]), `high ${gq(A.g[3])} · medium ${gq(A.g[4])} · low ${gq(A.g[5])}`) +
    kpi("Left out of the house view", gqv(ml + A.out.rule + A.after + A.undated), `med/low ${Y0}-${Y1} ${gq(ml)}${A.out.rule > 0.05 ? ` · no-tenant rule ${gq(A.out.rule)}` : ""} · after ${Y1} ${gq(A.after)}${A.undated > 0.05 ? ` · undated ${gq(A.undated)}` : ""}`) + `</div>`;
  h += `<div class="grid2">` + panel("How it grows: capacity at each year end", `IT-eq · operating base + the house view adds, stacked by stage; ×multiple vs end-${Y0 - 1}`, cumChart(A)) +
    panel("Adds per year", "IT-eq · house view by activation year (Aterio's dates, no delay haircut)", coYears(A)) + `</div>`;
  h += `<div class="grid2">` + panel("Where", "", stMap(A, st)) +
    panel("Who builds it", "Operators (Aterio provider), ranked by the house view adds. GW IT-eq. Click a name to open it.", `<div class="tscroll">${stOps(A)}</div>`) + `</div>`;
  const tabs = [["camp", `Campuses (${A.list.length.toLocaleString("en-US")})`, `<p class="cs">Largest first by operating + pipeline, IT-eq. Campus cost is Aterio's whole-campus figure. “In registry” = the campus is in Capstone's DC delay-risk registry.</p><div class="tbl-wrap">${coCamps({own: new Set(), n: nm}, A, true)}</div>`],
    ["geo", us ? "By state" : "By county", `<p class="cs">GW IT-eq, ranked by the house view adds.</p><div class="tscroll">${stGeo(A, st)}</div>`],
    ["cp", "Tenants, money and power", `<p class="cs">Other companies named on the ${esc(nm)} buildings, ranked by the house view adds on them (withdrawn excluded).</p>${stCounter(A)}`]];
  h += `<section class="panel">${tabsHTML(tabs)}<div style="margin-top:12px"><button type="button" class="btn" id="stCsv">${ICON_DL}Download CSV of every campus</button></div></section>`;
  h += note(`Aterio census as of ${esc(M.asof)}, Capstone treatment: GW IT-eq = facility MW ÷ ${FK}; house view = went live in ${Y0}, under construction, delayed, and announced High, dated ${Y0}-${Y1} on Aterio's dates. ${MED_NOTE} Operating before ${Y0} = active buildings dated before ${Y0} or undated. End-${Y1} assumes nothing operating today retires. Aterio's dates have slipped export after export (median +9 months for what was under construction a year ago), so read the later years as an upper path.`);
  $("view").innerHTML = h;
  fitStMap(A, st);
  $("stCsv").onclick = () => coCsv({own: new Set(), n: nm}, A);
}

/* ------------------------------------------------------------------ view: method and the Bernstein cross-check */
function showMethod(){
  LS.e = null; LS.st = null; setView("method", "Method");
  $("view").innerHTML = vhead("Reference", "Method and sources", "", `Aterio census as of ${esc(M.asof)} · house rules of ${esc(M.rules_decided)} · page built ${esc(M.built)}`, "") +
    panel("How the numbers are built", "", `<dl class="mdl">
      <dt>Licensed data</dt><dd>Aterio data-center census, internal use only.</dd>
      <dt>GW IT-eq</dt><dd>Facility power ÷ ${M.fac_it}, Aterio's own median (house rule 1). The Bernstein table below is the one place on facility GW.</dd>
      <dt>Self-built</dt><dd>Aterio lists the company as the <b>provider</b>: owner and operator of the building.</dd>
      <dt>Leased</dt><dd>Aterio names the company among the <b>end users</b> of someone else's building (colo, developer or neocloud). Leases are only what Aterio has recorded, so leased GW is a floor.</dd>
      <dt>Shared buildings</dt><dd>A building with several named tenants counts in full for each (${C.map(c => `${esc(c.name)} ${f1(c.shared_it)}`).join(", ")} GW shared), so never add companies together.</dd>
      <dt>House view</dt><dd>What went live in ${Y0}, what is under construction or delayed, and announced projects rated High likelihood, dated ${Y0}-${Y1} on Aterio's own dates; a hyperscaler self-build counts as having a tenant. Same rules as the Aterio deck tab of the <a href="dc-delay-risk.html#aterio-deck">DC delay-risk page</a>.</dd>
      <dt>Medium layer</dt><dd>Announced projects Aterio rates <b>Medium</b> likelihood, dated ${Y0}-${Y1}, with the same low-likelihood / no-tenant campus rule. Drawn hatched on top of the house view and never counted in it: the house rules take High only. US: ${f1(M.us.med || 0)} GW on top of the ${f1(M.us.house)} GW house view; the four: ${C.map(c => `${esc(c.name)} ${f1(c.med || 0)}`).join(", ")} GW.</dd>
      <dt>Dates</dt><dd>Aterio's dates have slipped export after export (median +9 months for what was under construction a year ago), so read the later years as an upper path. End-${Y1} totals assume nothing operating today retires.</dd>
      <dt>Search</dt><dd>Covers every name the census carries in any role (operator, tenant, backer, financier, partner, utility, behind-the-meter). Wiki companies bundle their aliases with the same matching as their page sections, so a wiki company can count more than its hyperscaler card (Google also appears as a financier). It also finds every developer and tenant the public registry names.</dd>
      <dt>Public registry</dt><dd>Capstone's bottom-up registry of the large US campuses from public sources (the <a href="dc-delay-risk.html">DC delay-risk page</a>; build of ${esc(RGM.asof)}): one row per dated phase, with developer, tenant, status, base date and the delay model's ${esc(RGM.scenLabel)} result. A company's registry rows are the phases whose developer or tenant field names it, matched on the name without legal or generic tail words (the terms are shown in its tab). Registry campuses are tied to Aterio campuses by the delay-risk page's hand-reviewed campus map. On the map, diamonds are registry campuses and circles Aterio's. The registry covers the large campuses only, so it sits below Aterio; never add the two.</dd></dl>`) +
    panel("Cross-check: Bernstein's player table", `<span id="bLead"></span>`, `<div class="tscroll"><table id="bTable"></table></div>`) +
    panel("Sources", "", `<p class="foot">Source: Aterio data-center census (${esc(M.inventory)}), licensed, internal use; Capstone calculations by <code>_wiki/_tools/build_aterio_hyperscalers.py</code> (rules in <code>_wiki/_data/aterio/treatment.json</code>; data also in <code>_wiki/_data/aterio/hyperscalers.json</code> and <code>company_lookup.json</code>). Rerun when a new Aterio export lands. The public-registry layer is read from <code>_wiki/_data/dc_projects/model_output.json</code> at render time; the Friday DC-monitor run re-renders this page with <code>--render-only</code>. Map: us-atlas states, Albers USA (lower 48).</p>`);
  bern();
}
function bern(){
  const B = M.bernstein; if (!B) { $("bLead").textContent = "No Bernstein file on disk."; return; }
  $("bLead").innerHTML = `${esc(B.source.broker)}, <i>${esc(B.source.title)}</i> (${esc(B.source.date)}; ${esc(B.source.analysts)}), Exhibits 15-17: GW by player on <b>Aterio data via Bernstein</b>, a later export than our ${esc(M.asof)}, basis not stated. Ours here is <b>facility</b> GW (no ÷${M.fac_it}) so the two sit on the same basis. A Bernstein figure above ours can mean a later export, campus-level counting or leases Aterio recorded later. Two what-ifs on the building side: <b>+ Delayed</b> adds Aterio's Delayed stage to + leased; <b>whole campus</b> also counts every announced building, any likelihood, on a campus where at least one building is already under construction. The highlighted cell in each block is our figure closest to Bernstein's. Whole-campus counting overshoots wherever a campus under construction carries a long announced tail, so a close match there points to a few specific campuses rather than to Bernstein's general method.`;
  const near = (vals, b) => { if (b == null) return -1; let k = -1, best = Infinity; vals.forEach((v, i) => { if (v != null && Math.abs(v - b) < best) { best = Math.abs(v - b); k = i; } }); return k; };
  const cell = (v, hit) => `<td class="n"${hit ? ` style="background:color-mix(in srgb,var(--accent) 16%,transparent);font-weight:650"` : ""}>${f1(v)}</td>`;
  $("bTable").innerHTML = `<tr><th>Company</th><th class="n">Operating · ours, self-built</th><th class="n">ours, + leased</th><th class="n">Bernstein</th><th class="n">Building · ours, self-built</th><th class="n">ours, + leased</th><th class="n">+ Delayed</th><th class="n">whole campus</th><th class="n">Bernstein</th></tr>` +
    C.map(c => { const r = B.rows[c.id] || {}, f = c.fac;
      const op = [f.op_self, f.op], uc = [f.uc_self, f.uc, f.dl == null ? null : f.uc + f.dl, f.uc_campus];
      const ko = near(op, r.active), ku = near(uc, r.uc);
      return `<tr><td><b>${esc(c.name)}</b><div class="why">Bernstein row: ${esc(c.bern)}</div></td>${op.map((v, i) => cell(v, i === ko)).join("")}<td class="n"><b>${f1(r.active)}</b></td>${uc.map((v, i) => cell(v, i === ku)).join("")}<td class="n"><b>${f1(r.uc)}</b></td></tr>`; }).join("");
}

/* ------------------------------------------------------------------ sidebar, routing, wiring */
function buildNav(){
  const li = (key, href, label, v, dot) => `<a href="${href}" data-k="${key}">${dot ? `<i class="nd" style="background:${dot}"></i>` : ""}<span>${esc(label)}</span>${v ? `<span class="nv">${esc(v)}</span>` : ""}</a>`;
  const grp = (t, items) => `<div class="ng"><p>${t}</p>${items.join("")}</div>`;
  const covered = new Set(Object.keys(coveredBy).map(Number));
  const stTop = ENT.map((e, i) => [e, i]).filter(([e]) => e.kind === "state" && e.t !== "US").sort((a, b) => b[0].house - a[0].house).slice(0, 8);
  const wikiTop = ENT.map((e, i) => [e, i]).filter(([e]) => e.kind === "wiki" && !FOUR.has(e.t)).sort((a, b) => b[0].mw - a[0].mw).slice(0, 6);
  const gw1 = v => (v / 1000).toFixed(1);
  $("nav").innerHTML =
    grp("Overview", [li("four", "#four", "The four compared", f1(sum(C.map(c => c.house)))), li("st:US", "#st=US", "United States", gw1(STX.US.house))]) +
    grp("Hyperscalers · GW 26-30", C.map(c => FOURI[c.id] >= 0 ? li("e:" + FOURI[c.id], coHash(FOURI[c.id]), c.name, f1(c.house), `var(--c-${c.id})`) : "")) +
    grp("Top states · GW 26-30", stTop.map(([e]) => li("st:" + e.st, "#st=" + e.st, e.n, gw1(e.house)))) +
    grp("Companies", wikiTop.map(([e, i]) => li("e:" + i, coHash(i), e.n, e.t))) +
    grp("Reference", [li("method", "#method", "Method and Bernstein check")]);
  $("sideFoot").innerHTML = `<span class="dot-live"></span>Aterio census <b>${esc(M.asof)}</b><br>House rules of ${esc(M.rules_decided)} · built ${esc(M.built)}<br>Licensed data, internal use` +
    `<a href="index.html">All dashboards <span aria-hidden="true">↗</span></a><a href="../index.html">Research wiki <span aria-hidden="true">↗</span></a>`;
}
function route(){
  closeDrop(); tip.style.display = "none";
  const h = location.hash; let m;
  if ((m = h.match(/^#co=(.+)$/))) { let n = ""; try { n = decodeURIComponent(m[1]); } catch (_) {}
    let i = ENT.findIndex(e => e.n === n && e.kind !== "state" && !e.dup);
    if (i < 0) { i = ENT.findIndex(e => e.n === n && e.kind !== "state"); if (i >= 0 && ENT[i].dup) i = tgt(i - R0); }   // a fully covered raw name opens its covering entry
    if (i >= 0) { if (LS.e !== i) LS.role = null; showCo(i); window.scrollTo(0, 0); return; } }
  if ((m = h.match(/^#st=([A-Z]{2})$/)) && STX[m[1]]) { showState(m[1]); window.scrollTo(0, 0); return; }
  if (h === "#method") showMethod(); else showFour();
  window.scrollTo(0, 0);
}
$("usPaths").innerHTML = Object.entries(M.map).map(([st, p]) => `<path class="stp" d="${p.d}"><title>${esc(SN(st))}</title></path>`).join("");
$("asof").textContent = M.asof;
$("themeBtn").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("hsdc-theme", r.dataset.theme); } catch (_) {} };
try { const t = localStorage.getItem("hsdc-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
(function wire(){
  const inp = $("coQ"), box = $("coList");
  inp.addEventListener("input", drop);
  inp.addEventListener("focus", () => { if (inp.value.trim()) drop(); });
  inp.addEventListener("keydown", ev => {
    if (ev.key === "ArrowDown") { ev.preventDefault(); if (box.hidden) drop(); else moveHi(1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); moveHi(-1); }
    else if (ev.key === "Enter") { ev.preventDefault(); if (box.hidden) drop(); if (LS.hits.length) pick(LS.hits[LS.hi]); }
    else if (ev.key === "Escape") closeDrop(); });
  box.addEventListener("mousedown", ev => { const it = ev.target.closest(".it"); if (it) { ev.preventDefault(); pick(+it.dataset.e); } });
  document.addEventListener("click", ev => {
    const tb = ev.target.closest("[data-tab]");
    if (tb) { const root = tb.closest(".tabs"); root.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", String(b === tb))); root.querySelectorAll("[data-pane]").forEach(p => { p.hidden = p.dataset.pane !== tb.dataset.tab; }); return; }
    const sa = ev.target.closest("[data-st]");
    if (sa) { ev.preventDefault(); openSt(sa.dataset.st); return; }
    const a = ev.target.closest("[data-e]");
    if (a && !a.closest("#coList")) { ev.preventDefault(); openEnt(+a.dataset.e); return; }
    if (!ev.target.closest(".srch")) closeDrop(); });
  window.addEventListener("hashchange", route);
})();
buildNav(); route();
</script>
