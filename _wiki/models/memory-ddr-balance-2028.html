    supply: {asml: 120, tsm: 45, intc: 12, totalCap: 2700, qualified: 100, hbmDemand: 109.0, hbmService: 100, node: 12.0, hbmDensity: 10.0, ddrDemand: 510.0}
  };

  const fmt = (v, d = 1) =&gt; Number(v).toLocaleString(&quot;en-US&quot;, {minimumFractionDigits: d, maximumFractionDigits: d});
  const fmt0 = v =&gt; Number(v).toLocaleString(&quot;en-US&quot;, {maximumFractionDigits: 0});
  const signedPct = v =&gt; `${v &gt;= 0 ? &quot;+&quot; : &quot;−&quot;}${fmt(Math.abs(v), 1)}%`;
  const pct = v =&gt; `${fmt(v, 1)}%`;
  const tag = (name, cls) =&gt; `&lt;span class=&quot;tag ${cls}&quot;&gt;${name}&lt;/span&gt;`;

  function readState() {
    return {
      asml: +ids.asml.value,
      tsm: +ids.tsm.value,
      intc: +ids.intc.value,
      totalCap: +ids.totalCap.value,
      qualified: +ids.qualified.value,
      hbmDemand: +ids.hbmDemand.value,
      hbmService: +ids.hbmService.value,
      node: +ids.node.value,
      hbmDensity: +ids.hbmDensity.value,
      ddrDemand: +ids.ddrDemand.value
    };
  }

  function calculate(s) {
    const memoryTools = Math.max(0, s.asml - s.tsm - s.intc - constants.otherLogicTools);
    const plannedGrossAdd = Math.max(0, s.totalCap - constants.baseCapacity2027);
    const qualifiedGrossAdd = plannedGrossAdd * s.qualified / 100;
    const totalCapacity = constants.baseCapacity2027 + qualifiedGrossAdd;
    const hbmBits = s.hbmDemand * s.hbmService / 100;
    const unmetHbmBits = Math.max(0, s.hbmDemand - hbmBits);
    const hbmWafers = hbmBits / (s.hbmDensity * constants.monthToYear);
    const ddrWafers = Math.max(0, totalCapacity - hbmWafers);
    const ddrDensity = constants.ddrDensity2027 * (1 + s.node / 100);
    const ddrSupply = ddrWafers * ddrDensity * constants.monthToYear;
    const gap = ddrSupply - s.ddrDemand;
    const suff = gap / s.ddrDemand * 100;
    const requiredDdrWafers = s.ddrDemand / (ddrDensity * constants.monthToYear);
    const requiredTotalCapacity = requiredDdrWafers + hbmWafers;
    const capacityGap = requiredTotalCapacity - totalCapacity;
    const maxHbmWafersAtBalance = Math.max(0, totalCapacity - requiredDdrWafers);
    const maxHbmBitsAtBalance = maxHbmWafersAtBalance * s.hbmDensity * constants.monthToYear;
    const hbmDemandCoverageAtDdrBalance = s.hbmDemand ? maxHbmBitsAtBalance / s.hbmDemand * 100 : 0;
    return {
      ...s, memoryTools, plannedGrossAdd, qualifiedGrossAdd, totalCapacity, hbmBits,
      unmetHbmBits, hbmWafers, ddrWafers, ddrDensity, ddrSupply, gap, suff,
      requiredDdrWafers, requiredTotalCapacity, capacityGap, maxHbmBitsAtBalance,
      hbmDemandCoverageAtDdrBalance
    };
  }

  function updateOutputs(s) {
    const pairs = [
      [&quot;#mem-asml-out&quot;, `${fmt0(s.asml)} tools`],
      [&quot;#mem-tsm-out&quot;, `${fmt0(s.tsm)} tools`],
      [&quot;#mem-intc-out&quot;, `${fmt0(s.intc)} tools`],
      [&quot;#mem-total-cap-out&quot;, `${fmt0(s.totalCap)}k wpm`],
      [&quot;#mem-qualified-out&quot;, `${fmt0(s.qualified)}%`],
      [&quot;#mem-hbm-demand-out&quot;, `${fmt(s.hbmDemand)} bn Gb`],
      [&quot;#mem-hbm-service-out&quot;, `${fmt0(s.hbmService)}%`],
      [&quot;#mem-node-out&quot;, `${fmt(s.node)}%`],
      [&quot;#mem-hbm-density-out&quot;, `${fmt(s.hbmDensity)} kGb`],
      [&quot;#mem-ddr-demand-out&quot;, `${fmt(s.ddrDemand)} bn Gb`]
    ];
    pairs.forEach(([selector, value]) =&gt; { root.querySelector(selector).textContent = value; });
  }

  function updateStats(r) {
    root.querySelector(&quot;#mem-headline&quot;).textContent =
      `${r.suff &gt;= 0 ? &quot;Yes&quot; : &quot;No&quot;} in the selected case: ${signedPct(r.suff)} DDR sufficiency.`;
    root.querySelector(&quot;#mem-headline-detail&quot;).textContent =
      `${fmt(r.totalCapacity)}k wpm total capacity and ${fmt(r.hbmBits)}bn Gb HBM output leave ${fmt(r.ddrSupply)}bn Gb for DDR vs ${fmt(r.ddrDemand)}bn Gb demand.`;
    root.querySelector(&quot;#mem-stat-suff&quot;).textContent = signedPct(r.suff);
    root.querySelector(&quot;#mem-stat-suff-detail&quot;).textContent =
      r.gap &gt;= 0 ? `${fmt(r.gap)} bn Gb surplus` : `${fmt(Math.abs(r.gap))} bn Gb short`;
    root.querySelector(&quot;#mem-stat-tools&quot;).textContent = `${fmt0(r.memoryTools)} / ${constants.memoryToolsPriorCase}`;
    root.querySelector(&quot;#mem-stat-tools-detail&quot;).textContent =
      r.memoryTools &gt;= constants.memoryToolsPriorCase
        ? `${fmt((r.memoryTools / constants.memoryToolsPriorCase - 1) * 100)}% above prior-case demand`
        : `${fmt((1 - r.memoryTools / constants.memoryToolsPriorCase) * 100)}% below prior-case demand`;
    root.querySelector(&quot;#mem-stat-hbm&quot;).textContent = `${fmt0(r.hbmWafers)}k wpm`;
    root.querySelector(&quot;#mem-stat-hbm-detail&quot;).textContent =
      `${fmt(r.hbmWafers / r.totalCapacity * 100)}% of DRAM wafers`;
    root.querySelector(&quot;#mem-selected-detail&quot;).textContent =
      r.suff &gt;= 0
        ? `Selected case balances DDR while serving ${fmt0(r.hbmService)}% of HBM demand.`
        : `DDR balance would cap 2028 HBM output at ${fmt(r.maxHbmBitsAtBalance)} bn Gb (${fmt0(r.hbmDemandCoverageAtDdrBalance)}% of modeled HBM demand), or require ${fmt0(Math.max(0, r.capacityGap))}k additional qualified wpm. HBM unmet in this selection: ${fmt(r.unmetHbmBits)} bn Gb.`;
  }

  function renderChart(r) {
    const svg = root.querySelector(&quot;#mem-chart&quot;);
    const W = 720, H = 330, left = 56, right = 18, top = 18, bottom = 52;
    const plotW = W - left - right, plotH = H - top - bottom;
    const supply = [...constants.historicalSupply, r.ddrSupply];
    const demand = [...constants.historicalDemand, r.ddrDemand];
    const suff = [...constants.historicalSuff, r.suff];
    const maxV = Math.ceil(Math.max(...supply, ...demand) / 100) * 100;
    const y = v =&gt; top + plotH - (v / maxV) * plotH;
    const groupW = plotW / constants.historicalYears.length;
    const barW = Math.min(40, groupW * 0.28);
    let html = `&lt;title id=&quot;mem-chart-title&quot;&gt;DDR supply versus demand through 2028&lt;/title&gt;
      &lt;desc id=&quot;mem-chart-desc&quot;&gt;Supply values are ${supply.map(v =&gt; fmt(v)).join(&quot;, &quot;)} billion gigabits and demand values are ${demand.map(v =&gt; fmt(v)).join(&quot;, &quot;)}.&lt;/desc&gt;`;
    const step = maxV &lt;= 600 ? 100 : 150;
    for (let t = 0; t &lt;= maxV; t += step) {
      const yy = y(t);
      html += `&lt;line class=&quot;grid&quot; x1=&quot;${left}&quot; y1=&quot;${yy}&quot; x2=&quot;${W - right}&quot; y2=&quot;${yy}&quot;&gt;&lt;/line&gt;
        &lt;text x=&quot;${left - 9}&quot; y=&quot;${yy + 4}&quot; text-anchor=&quot;end&quot; class=&quot;text-small&quot;&gt;${t}&lt;/text&gt;`;
    }
    html += `&lt;line class=&quot;axis&quot; x1=&quot;${left}&quot; y1=&quot;${top + plotH}&quot; x2=&quot;${W - right}&quot; y2=&quot;${top + plotH}&quot;&gt;&lt;/line&gt;
      &lt;text x=&quot;12&quot; y=&quot;${top + plotH / 2}&quot; transform=&quot;rotate(-90 12 ${top + plotH / 2})&quot; text-anchor=&quot;middle&quot; class=&quot;text-small&quot;&gt;bn Gb, annualized run-rate&lt;/text&gt;`;
    constants.historicalYears.forEach((yr, i) =&gt; {
      const cx = left + groupW * (i + 0.5);
      const sx = cx - barW - 3;
      const dx = cx + 3;
      const sy = y(supply[i]);
      const dy = y(demand[i]);
      const sh = top + plotH - sy;
      const dh = top + plotH - dy;
      html += `&lt;rect class=&quot;supply-bar&quot; x=&quot;${sx}&quot; y=&quot;${sy}&quot; width=&quot;${barW}&quot; height=&quot;${sh}&quot; rx=&quot;2&quot;&gt;
          &lt;title&gt;${yr} DDR supply: ${fmt(supply[i])} bn Gb&lt;/title&gt;
        &lt;/rect&gt;
        &lt;rect class=&quot;demand-bar&quot; x=&quot;${dx}&quot; y=&quot;${dy}&quot; width=&quot;${barW}&quot; height=&quot;${dh}&quot; rx=&quot;2&quot;&gt;
          &lt;title&gt;${yr} DDR demand: ${fmt(demand[i])} bn Gb&lt;/title&gt;
        &lt;/rect&gt;
        &lt;text class=&quot;value-label text-small&quot; x=&quot;${sx + barW / 2}&quot; y=&quot;${Math.max(top + 12, sy - 7)}&quot; text-anchor=&quot;middle&quot;&gt;${fmt0(supply[i])}&lt;/text&gt;
        &lt;text class=&quot;value-label text-small&quot; x=&quot;${dx + barW / 2}&quot; y=&quot;${Math.max(top + 12, dy - 7)}&quot; text-anchor=&quot;middle&quot;&gt;${fmt0(demand[i])}&lt;/text&gt;
        &lt;text class=&quot;year-label&quot; x=&quot;${cx}&quot; y=&quot;${top + plotH + 22}&quot; text-anchor=&quot;middle&quot;&gt;${yr}&lt;/text&gt;
        &lt;text x=&quot;${cx}&quot; y=&quot;${top + plotH + 42}&quot; text-anchor=&quot;middle&quot; class=&quot;text-small&quot;&gt;${signedPct(suff[i])}&lt;/text&gt;`;
      if (i === 3) {
        const gx = cx + barW * 1.35;
        html += `&lt;line class=&quot;gap-line&quot; x1=&quot;${gx}&quot; y1=&quot;${sy}&quot; x2=&quot;${gx}&quot; y2=&quot;${dy}&quot;&gt;&lt;/line&gt;`;
      }
    });
    svg.innerHTML = html;
  }

  function renderBridge(r) {
    const rows = [
      [&quot;ASML Low-NA capacity plan&quot;, `${fmt0(r.asml)} tools`, tag(&quot;HARD&quot;, &quot;hard&quot;), &quot;ASML Q2 call · 15 Jul 2026; shipment realization is PARTIAL&quot;],
      [&quot;less TSMC scenario&quot;, `(${fmt0(r.tsm)}) tools`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), &quot;Only 2027 40–45 booked is sourced: Redburn · 23 Jun 2026&quot;],
      [&quot;less Intel scenario&quot;, `(${fmt0(r.intc)}) tools`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), &quot;Orders +30–40%: KeyBanc/Vinh via Semiecosystem · 24 Jul; not EUV-specific&quot;],
      [&quot;less other Low-NA logic&quot;, `(${constants.otherLogicTools}) tools`, tag(&quot;PARTIAL&quot;, &quot;partial&quot;), &quot;Bristlemoon · Jun 2026&quot;],
      [&quot;Low-NA memory residual&quot;, `${fmt(r.memoryTools)} tools`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), `${fmt0(r.asml)} − ${fmt0(r.tsm)} − ${fmt0(r.intc)} − ${constants.otherLogicTools}`],
      [&quot;Prior-case incremental DRAM demand&quot;, `${constants.memoryToolsPriorCase} tools`, tag(&quot;PARTIAL&quot;, &quot;partial&quot;), &quot;Bristlemoon prior node/HBM case · Jun 2026; feasibility comparator only&quot;],
      [&quot;High-NA memory equivalents&quot;, `0 credited`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), &quot;Not converted 1:1; DRAM adoption timing remains a separate constraint&quot;],
      [&quot;2027 DRAM wafer capacity&quot;, `${fmt(constants.baseCapacity2027)}k wpm`, tag(&quot;ANCHOR&quot;, &quot;anchor&quot;), &quot;Capstone engine · 27 Jul 2026; UBS vendor sum ≈2,170k&quot;],
      [&quot;2028 planned total capacity&quot;, `${fmt(r.totalCap)}k wpm`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), &quot;Capstone prior house default 2,480k; editable&quot;],
      [&quot;planned gross wafer add&quot;, `${fmt(r.plannedGrossAdd)}k wpm`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), `${fmt(r.totalCap)} − ${fmt(constants.baseCapacity2027)}`],
      [&quot;qualified by YE&quot;, `${fmt0(r.qualified)}%`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), &quot;Shipment → install → qualification timing; 100% is supply-friendly&quot;],
      [&quot;effective 2028 DRAM wafers&quot;, `${fmt(r.totalCapacity)}k wpm`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), `${fmt(constants.baseCapacity2027)} + ${fmt(r.plannedGrossAdd)} × ${fmt0(r.qualified)}%`],
      [&quot;HBM bit demand&quot;, `${fmt(r.hbmDemand)} bn Gb`, tag(&quot;PARTIAL&quot;, &quot;partial&quot;), &quot;Capstone 27 Jul 2026 citing Bernstein ≈109bn; prior house 80bn&quot;],
      [&quot;HBM bits produced / unmet&quot;, `${fmt(r.hbmBits)} / ${fmt(r.unmetHbmBits)} bn Gb`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), `${fmt(r.hbmDemand)} × ${fmt0(r.hbmService)}%`],
      [&quot;HBM wafers required&quot;, `(${fmt(r.hbmWafers)}k wpm)`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), `${fmt(r.hbmBits)} ÷ (${fmt(r.hbmDensity)} × 0.012)`],
      [&quot;DDR wafers remaining&quot;, `${fmt(r.ddrWafers)}k wpm`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), `${fmt(r.totalCapacity)} − ${fmt(r.hbmWafers)}`],
      [&quot;DDR bits per wafer&quot;, `${fmt(r.ddrDensity)} kGb`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), `22.72 × (1 + ${fmt(r.node)}%)`],
      [&quot;DDR supply&quot;, `${fmt(r.ddrSupply)} bn Gb`, tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), `${fmt(r.ddrWafers)} × ${fmt(r.ddrDensity)} × 0.012`],
      [&quot;DDR sufficiency&quot;, signedPct(r.suff), tag(&quot;ESTIMATE&quot;, &quot;estimate&quot;), `${fmt(r.ddrSupply)} ÷ ${fmt(r.ddrDemand)} − 1`]
    ];
    root.querySelector(&quot;#mem-bridge-body&quot;).innerHTML = rows.map(row =&gt;
      `&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;${row[0]}&lt;/th&gt;&lt;td class=&quot;numeric&quot;&gt;${row[1]}&lt;/td&gt;&lt;td&gt;${row[2]}&lt;/td&gt;&lt;td class=&quot;source&quot;&gt;${row[3]}&lt;/td&gt;&lt;/tr&gt;`
    ).join(&quot;&quot;);
  }

  function calcWith(base, patch) {
    return calculate({...base, ...patch}).suff;
  }

  function renderSensitivity(s, r) {
    const memoryToolsAt = (tsm, intc) =&gt; Math.max(0, s.asml - tsm - intc - constants.otherLogicTools);
    const rows = [
      [&quot;HBM demand&quot;, `90 bn Gb → ${signedPct(calcWith(s, {hbmDemand: 90}))}`, `${fmt(s.hbmDemand)} → ${signedPct(r.suff)}`, `120 bn Gb → ${signedPct(calcWith(s, {hbmDemand: 120}))}`],
      [&quot;Total DRAM wafers&quot;, `2,300k → ${signedPct(calcWith(s, {totalCap: 2300}))}`, `${fmt0(s.totalCap)}k → ${signedPct(r.suff)}`, `2,800k → ${signedPct(calcWith(s, {totalCap: 2800}))}`],
      [&quot;Gross adds qualified&quot;, `70% → ${signedPct(calcWith(s, {qualified: 70}))}`, `${fmt0(s.qualified)}% → ${signedPct(r.suff)}`, `100% → ${signedPct(calcWith(s, {qualified: 100}))}`],
      [&quot;TSMC Low-NA allocation&quot;, `45 → ${fmt0(memoryToolsAt(45, s.intc))} memory tools`, `${fmt0(s.tsm)} → ${fmt0(r.memoryTools)}`, `55 → ${fmt0(memoryToolsAt(55, s.intc))} memory tools`],
      [&quot;Intel Low-NA allocation&quot;, `8 → ${fmt0(memoryToolsAt(s.tsm, 8))} memory tools`, `${fmt0(s.intc)} → ${fmt0(r.memoryTools)}`, `20 → ${fmt0(memoryToolsAt(s.tsm, 20))} memory tools`],
      [&quot;Node uplift&quot;, `5% → ${signedPct(calcWith(s, {node: 5}))}`, `${fmt(s.node)}% → ${signedPct(r.suff)}`, `12% → ${signedPct(calcWith(s, {node: 12}))}`],
      [&quot;HBM density&quot;, `7 kGb → ${signedPct(calcWith(s, {hbmDensity: 7}))}`, `${fmt(s.hbmDensity)} → ${signedPct(r.suff)}`, `10 kGb → ${signedPct(calcWith(s, {hbmDensity: 10}))}`],
      [&quot;HBM served&quot;, `60% → ${signedPct(calcWith(s, {hbmService: 60}))}`, `${fmt0(s.hbmService)}% → ${signedPct(r.suff)}`, `100% → ${signedPct(calcWith(s, {hbmService: 100}))}`],
      [&quot;DDR demand&quot;, `500 bn Gb → ${signedPct(calcWith(s, {ddrDemand: 500}))}`, `${fmt(s.ddrDemand)} → ${signedPct(r.suff)}`, `560 bn Gb → ${signedPct(calcWith(s, {ddrDemand: 560}))}`]
    ];
    root.querySelector(&quot;#mem-sensitivity-body&quot;).innerHTML = rows.map(row =&gt;
      `&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;${row[0]}&lt;/th&gt;&lt;td class=&quot;numeric&quot;&gt;${row[1]}&lt;/td&gt;&lt;td class=&quot;numeric&quot;&gt;${row[2]}&lt;/td&gt;&lt;td class=&quot;numeric&quot;&gt;${row[3]}&lt;/td&gt;&lt;/tr&gt;`
    ).join(&quot;&quot;);
  }

  function renderGuardrails(r) {
    const status = (kind, label) =&gt; `&lt;span class=&quot;status ${kind}&quot;&gt;${label}&lt;/span&gt;`;
    const memoryGap = (r.memoryTools / constants.memoryToolsPriorCase - 1) * 100;
    const rows = [
      [&quot;2027 HBM wafer level&quot;, &quot;690k wpm&quot;, &quot;668k wpm · SemiAnalysis, 6 Feb 2026&quot;, status(&quot;&quot;, &quot;pass&quot;)],
      [&quot;2027 total DRAM capacity&quot;, &quot;2,176k wpm&quot;, &quot;≈2,170k wpm · UBS vendor sum, 3 Jul 2026&quot;, status(&quot;&quot;, &quot;pass&quot;)],
      [&quot;2028 total DRAM capacity&quot;, `${fmt(r.totalCapacity)}k wpm`, &quot;No independent all-industry 2028 capacity anchor&quot;, status(&quot;bad&quot;, &quot;unvalidated&quot;)],
      [&quot;Low-NA memory allocation flow&quot;, `${fmt(r.memoryTools)} tools`, `51-tool prior-case demand · Bristlemoon, Jun 2026 (${signedPct(memoryGap)})`, status(&quot;warn&quot;, &quot;watch&quot;)],
      [&quot;HBM demand cross-source&quot;, `${fmt(r.hbmDemand)} bn Gb`, &quot;≈78–80bn prior house/Bristlemoon vs ≈109 Bernstein case&quot;, status(&quot;warn&quot;, &quot;watch&quot;)],
      [&quot;Low-NA / High-NA split&quot;, &quot;Low-NA only&quot;, &quot;High-NA adoption timing not converted&quot;, status(&quot;bad&quot;, &quot;unvalidated&quot;)],
      [&quot;Qualification timing&quot;, `${fmt0(r.qualified)}% by YE`, &quot;No independent install/qualification curve&quot;, status(&quot;bad&quot;, &quot;unvalidated&quot;)]
    ];
    root.querySelector(&quot;#mem-guard-body&quot;).innerHTML = rows.map(row =&gt;
      `&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;${row[0]}&lt;/th&gt;&lt;td class=&quot;numeric&quot;&gt;${row[1]}&lt;/td&gt;&lt;td class=&quot;numeric source&quot;&gt;${row[2]}&lt;/td&gt;&lt;td&gt;${row[3]}&lt;/td&gt;&lt;/tr&gt;`
    ).join(&quot;&quot;);
  }

  function render() {
    const s = readState();
    const r = calculate(s);
    updateOutputs(s);
    updateStats(r);
    renderChart(r);
    renderBridge(r);
    renderSensitivity(s, r);
    renderGuardrails(r);
  }

  Object.values(ids).forEach(input =&gt; input.addEventListener(&quot;input&quot;, () =&gt; {
    root.querySelectorAll(&quot;[data-preset]&quot;).forEach(btn =&gt; btn.classList.remove(&quot;btn-primary&quot;));
    render();
  }));

  root.querySelectorAll(&quot;[data-preset]&quot;).forEach(button =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      const preset = presets[button.dataset.preset];
      Object.entries(preset).forEach(([key, value]) =&gt; { ids[key].value = value; });
      root.querySelectorAll(&quot;[data-preset]&quot;).forEach(btn =&gt; btn.classList.toggle(&quot;btn-primary&quot;, btn === button));
      render();
    });
  });

  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
