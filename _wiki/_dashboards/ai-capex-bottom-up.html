}

.form-range:disabled {

}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {

}

        &lt;div class=&quot;source-row&quot;&gt;&lt;strong&gt;Revenue/GW&lt;/strong&gt;&lt;span&gt;House point $20bn NVDA; observed frames span Trainium &amp;lt;$10bn, merchant GPU ~$12–13bn and premium GPU ~$25bn.&lt;/span&gt;&lt;span class=&quot;tag partial&quot;&gt;PARTIAL&lt;/span&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ai-capex-dashboard&#x27;);
      const years = [&#x27;CY25&#x27;, &#x27;CY26E&#x27;, &#x27;CY27E&#x27;, &#x27;CY28E&#x27;];
      const data = {
        chipsM: [10.126, 15.449, 21.385, 22.700],
        capex: [396.261, 901.599, 1733.854, 2584.253],
        stack: {
          chips: [190.171, 399.900, 692.003, 992.480],
          network: [65.260, 178.576, 407.185, 650.415],
          other: [140.830, 323.122, 634.666, 941.359]
        },
        gwAdded: [12.861, 27.072, 47.483, 63.205],
        capexPerGw: [30.811, 33.304, 36.515, 40.886],
        hyperModel: [410.130, 722.177, 1044.907, 1426.413],
        hyperBottom: [334.102, 655.009, 1098.504, 1426.413],
        semiTotalGw: [48.0, 71.153, 108.511, 173.5],
        jpmCapexLow: [410.0, 700.0, 1100.0, null],
        jpmCapexHigh: [410.0, 725.0, 1100.0, null]
      };
      const deployment = {
        &#x27;Top 4&#x27;: { house:[33.210,54.696,87.213,125.785], street:[34.094,51.921,75.517,102.050], note:&#x27;The house is close in CY25, then rises above the sell-side average by 5% in CY26, 15% in CY27 and 23% in CY28. The widening is driven mainly by Google and Meta.&#x27; },
        &#x27;Google&#x27;: { house:[8.021,15.225,26.506,37.822], street:[6.526,11.319,18.244,27.374], note:&#x27;The workbook itself flags 2027–28 as stretched. House capex is similar to major sell-side frames, but lower TPU capex/GW converts the same dollars into materially more capacity.&#x27; },
        &#x27;Amazon&#x27;: { house:[12.800,18.359,26.544,37.655], street:[14.035,19.985,27.310,34.360], note:&#x27;Broadly calibrated through 2027. CY28 moves 10% above the sell-side average as annual additions stay elevated.&#x27; },
        &#x27;Microsoft&#x27;: { house:[7.837,12.957,19.822,26.870], street:[8.200,11.500,16.350,21.400], note:&#x27;Near the street in CY25–26, then 21–26% above the average in 2027–28. The current house path is still below the most aggressive Morgan Stanley capacity frame.&#x27; },
        &#x27;Meta&#x27;: { house:[4.553,8.156,14.341,23.438], street:[5.333,9.118,13.613,18.916], note:&#x27;Below street through CY26, roughly in line in CY27 and 24% above by CY28. The workbook comment explicitly marks the CY28 level as stretched.&#x27; }
      };
      const architectures = {
        &#x27;NVIDIA GPU&#x27;: [34.219,37.299,43.116,50.487],
        &#x27;Google TPU&#x27;: [24.835,27.729,31.662,40.062],
        &#x27;Trainium&#x27;: [18.668,21.545,25.178,27.809],
        &#x27;AMD GPU&#x27;: [27.048,32.820,35.044,35.307],
        &#x27;Meta MTIA&#x27;: [24.373,25.551,32.492,38.714]
      };
      const streetCost = {
        &#x27;CY26E&#x27;: {&#x27;Google TPU&#x27;:36.7,&#x27;Amazon&#x27;:24.9,&#x27;Meta MTIA&#x27;:45.4,&#x27;NVIDIA GPU&#x27;:39.0},
        &#x27;CY27E&#x27;: {&#x27;Google TPU&#x27;:34.9,&#x27;Amazon&#x27;:26.6,&#x27;Meta MTIA&#x27;:43.1,&#x27;NVIDIA GPU&#x27;:49.0},
        &#x27;CY28E&#x27;: {&#x27;Google TPU&#x27;:38.4,&#x27;Amazon&#x27;:29.8,&#x27;Meta MTIA&#x27;:47.4,&#x27;NVIDIA GPU&#x27;:49.5}
      };
      let yearIndex = 1;
      let company = &#x27;Top 4&#x27;;

      const money = v =&gt; v &gt;= 1000 ? &#x27;$&#x27; + (v/1000).toFixed(2) + &#x27;tn&#x27; : &#x27;$&#x27; + v.toFixed(v &gt;= 100 ? 0 : 1) + &#x27;bn&#x27;;
      const one = v =&gt; Number(v).toFixed(1);
      const pct = v =&gt; (v &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;) + (v*100).toFixed(0) + &#x27;%&#x27;;
      const ratio = (a,b) =&gt; b ? a/b : null;

      function renderYearSwitch() {
        const host = root.querySelector(&#x27;#year-switch&#x27;);
        host.innerHTML = years.map((y,i) =&gt; `&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-year=&quot;${i}&quot; aria-pressed=&quot;${i===yearIndex}&quot;&gt;${y}&lt;/button&gt;`).join(&#x27;&#x27;);
        host.querySelectorAll(&#x27;button&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; {
          yearIndex = Number(btn.dataset.year);
          renderAll();
        }));
      }

      function renderMetrics() {
        const i = yearIndex;
        const reconciliation = data.hyperBottom[i] / data.hyperModel[i];
        const metrics = [
          [&#x27;Bottom-up AI capex&#x27;, money(data.capex[i]), i === 0 ? &#x27;n/a - CY24 not loaded&#x27; : `${pct(data.capex[i]/data.capex[i-1]-1)} y/y`, &#x27;partial&#x27;, &#x27;MODEL&#x27;],
          [&#x27;Facility-equivalent GW added&#x27;, one(data.gwAdded[i]) + &#x27; GW&#x27;, `${one(data.capexPerGw[i])}bn capex/GW`, &#x27;partial&#x27;, &#x27;MODEL&#x27;],
          [&#x27;Top-4 company-model capex&#x27;, money(data.hyperModel[i]), `${money(data.hyperBottom[i])} bottom-up allocated`, &#x27;partial&#x27;, &#x27;MODEL&#x27;],
          [&#x27;Top-4 bottom-up / company models&#x27;, (reconciliation*100).toFixed(0)+&#x27;%&#x27;, reconciliation &gt;= .9 &amp;&amp; reconciliation &lt;= 1.1 ? &#x27;Inside ±10% guardrail&#x27; : &#x27;Outside ±10% guardrail&#x27;, reconciliation &gt;= .9 &amp;&amp; reconciliation &lt;= 1.1 ? &#x27;anchor&#x27; : &#x27;estimate&#x27;, &#x27;CHECK&#x27;]
        ];
        root.querySelector(&#x27;#metric-grid&#x27;).innerHTML = metrics.map(m =&gt; `
          &lt;div class=&quot;card viz-stat&quot;&gt;
            &lt;div class=&quot;context&quot;&gt;${m[0]}&lt;/div&gt;
            &lt;div class=&quot;viz-stat-value&quot;&gt;${m[1]}&lt;/div&gt;
            &lt;div class=&quot;context&quot;&gt;${m[2]}&lt;/div&gt;
            &lt;div style=&quot;margin-top:.6rem&quot;&gt;&lt;span class=&quot;tag ${m[3]}&quot;&gt;${m[4]}&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#overview-note&#x27;).textContent =
          years[i] + &#x27;: exact workbook outputs, subject to the assumptions and QA flags below.&#x27;;
      }

      function renderStack() {
        const max = Math.max(...data.capex);
        const host = root.querySelector(&#x27;#stack-chart&#x27;);
        host.innerHTML = years.map((y,i) =&gt; {
          const total = data.capex[i];
          const width = total/max*100;
          return `&lt;div class=&quot;stack-row&quot;&gt;
            &lt;strong&gt;${y}&lt;/strong&gt;
            &lt;div class=&quot;stack-track&quot; aria-label=&quot;${y}: ${money(total)} total&quot;&gt;
              &lt;span class=&quot;stack-seg chips&quot; style=&quot;width:${data.stack.chips[i]/max*100}%&quot; aria-label=&quot;Chips ${money(data.stack.chips[i])}&quot;&gt;&lt;/span&gt;
              &lt;span class=&quot;stack-seg network&quot; style=&quot;width:${data.stack.network[i]/max*100}%&quot; aria-label=&quot;Networking ${money(data.stack.network[i])}&quot;&gt;&lt;/span&gt;
              &lt;span class=&quot;stack-seg other&quot; style=&quot;width:${data.stack.other[i]/max*100}%&quot; aria-label=&quot;Power land and shell ${money(data.stack.other[i])}&quot;&gt;&lt;/span&gt;
            &lt;/div&gt;
            &lt;span class=&quot;stack-value&quot;&gt;${money(total)}&lt;/span&gt;
          &lt;/div&gt;`;
        }).join(&#x27;&#x27;) + `&lt;div class=&quot;legend&quot;&gt;
          &lt;span&gt;&lt;i class=&quot;swatch chips&quot;&gt;&lt;/i&gt; Chips&lt;/span&gt;
          &lt;span&gt;&lt;i class=&quot;swatch network&quot;&gt;&lt;/i&gt; Networking + CPU + storage&lt;/span&gt;
          &lt;span&gt;&lt;i class=&quot;swatch other&quot;&gt;&lt;/i&gt; Power + land + shell&lt;/span&gt;
        &lt;/div&gt;`;
        const i = yearIndex;
        const shares = [&#x27;chips&#x27;,&#x27;network&#x27;,&#x27;other&#x27;].map(k =&gt; data.stack[k][i]/data.capex[i]);
        root.querySelector(&#x27;#stack-year-title&#x27;).textContent = years[i] + &#x27; composition&#x27;;
        root.querySelector(&#x27;#stack-comment&#x27;).textContent =
          `Physical infrastructure remains ${Math.round((shares[1]+shares[2])*100)}% of the build. The model is not simply a silicon forecast.`;
        root.querySelector(&#x27;#stack-detail&#x27;).innerHTML = `
          &lt;dt&gt;Chips&lt;/dt&gt;&lt;dd&gt;${money(data.stack.chips[i])} · ${(shares[0]*100).toFixed(0)}%&lt;/dd&gt;
          &lt;dt&gt;Networking/CPU/storage&lt;/dt&gt;&lt;dd&gt;${money(data.stack.network[i])} · ${(shares[1]*100).toFixed(0)}%&lt;/dd&gt;
          &lt;dt&gt;Power/land/shell&lt;/dt&gt;&lt;dd&gt;${money(data.stack.other[i])} · ${(shares[2]*100).toFixed(0)}%&lt;/dd&gt;
          &lt;dt&gt;Weighted capex/GW&lt;/dt&gt;&lt;dd&gt;${money(data.capexPerGw[i])}&lt;/dd&gt;`;
      }

      function renderCompanyTabs() {
        const host = root.querySelector(&#x27;#company-tabs&#x27;);
        host.innerHTML = Object.keys(deployment).map(name =&gt;
          `&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-company=&quot;${name}&quot; aria-pressed=&quot;${name===company}&quot;&gt;${name}&lt;/button&gt;`
        ).join(&#x27;&#x27;);
        host.querySelectorAll(&#x27;button&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; {
          company = btn.dataset.company;
          renderCompanyTabs();
          renderDeployment();
        }));
      }

      function renderDeployment() {
        const d = deployment[company];
        const max = Math.max(...d.house,...d.street)*1.05;
        root.querySelector(&#x27;#deployment-chart&#x27;).innerHTML = years.map((y,i) =&gt; `
          &lt;div class=&quot;paired-row&quot;&gt;
            &lt;strong&gt;${y}&lt;/strong&gt;
            &lt;div class=&quot;paired-bars&quot;&gt;
              &lt;div class=&quot;barline&quot;&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;div class=&quot;barfill house&quot; style=&quot;width:${d.house[i]/max*100}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;barvalue&quot;&gt;${one(d.house[i])} GW&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;barline&quot;&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;div class=&quot;barfill street&quot; style=&quot;width:${d.street[i]/max*100}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;barvalue&quot;&gt;${one(d.street[i])} GW&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;`).join(&#x27;&#x27;) + `&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i class=&quot;swatch chips&quot;&gt;&lt;/i&gt; House&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;swatch other&quot;&gt;&lt;/i&gt; Sell-side average&lt;/span&gt;&lt;/div&gt;`;
        const i = yearIndex;
        const delta = d.house[i]/d.street[i]-1;
        root.querySelector(&#x27;#deployment-commentary&#x27;).innerHTML = `
          &lt;div class=&quot;compare-comment&quot;&gt;
            &lt;span class=&quot;tag partial&quot;&gt;${company.toUpperCase()}&lt;/span&gt;
            &lt;h3&gt;${years[i]}: ${pct(delta)} versus street&lt;/h3&gt;
            &lt;p&gt;${d.note}&lt;/p&gt;
          &lt;/div&gt;
          &lt;div class=&quot;compare-comment&quot;&gt;
            &lt;strong&gt;Selected-year arithmetic&lt;/strong&gt;
            &lt;p&gt;${one(d.house[i])} GW house ÷ ${one(d.street[i])} GW street = ${(d.house[i]/d.street[i]).toFixed(2)}×.&lt;/p&gt;
          &lt;/div&gt;`;
      }

      function renderArchitectures() {
        const i = yearIndex;
        root.querySelector(&#x27;#architecture-grid&#x27;).innerHTML = Object.entries(architectures).map(([name,vals],idx) =&gt; {
          const weighted = data.capexPerGw[i];
          return `&lt;div class=&quot;architecture ${idx===0?&#x27;primary&#x27;:&#x27;&#x27;}&quot;&gt;
            &lt;span class=&quot;tag ${idx===0?&#x27;partial&#x27;:&#x27;estimate&#x27;}&quot;&gt;${idx===0?&#x27;GPU&#x27;:&#x27;ARCH&#x27;}&lt;/span&gt;
            &lt;strong style=&quot;display:block;margin-top:.5rem&quot;&gt;${name}&lt;/strong&gt;
            &lt;div class=&quot;value&quot;&gt;${money(vals[i])}/GW&lt;/div&gt;
            &lt;div class=&quot;delta&quot;&gt;${pct(vals[i]/weighted-1)} vs weighted model&lt;/div&gt;
          &lt;/div&gt;`;
        }).join(&#x27;&#x27;);
      }

      function renderChecks() {
        const i = yearIndex;
        const low = data.jpmCapexLow[i], high = data.jpmCapexHigh[i];
        const model = data.hyperModel[i], bottom = data.hyperBottom[i];
        const within = low != null ? (model &gt;= low &amp;&amp; model &lt;= high) : false;
        root.querySelector(&#x27;#check-hyperscaler&#x27;).innerHTML = low != null ? `
          &lt;div class=&quot;formula&quot;&gt;Company-model capex ${money(model)} vs JPM ${money(low)}${high!==low?&#x27;–&#x27;+money(high).replace(&#x27;$&#x27;,&#x27;&#x27;) : &#x27;&#x27;}; bottom-up allocation ${money(bottom)}.&lt;/div&gt;
          ${within ? &#x27;The company-model envelope is inside the JPM range.&#x27; : `The company-model envelope is ${pct(model/low-1)} versus the JPM reference.`}
          The bottom-up allocation reconciles to ${(bottom/model*100).toFixed(0)}% of the company models. Same Top-4 basket; 16 Jun 2026 JPM reference.` :
          `No canonical JPM Top-4 range is carried for ${years[i]}. The dashboard therefore shows the house path without a pass/fail label.`;

        const houseGw = deployment[&#x27;Top 4&#x27;].house[i];
        const semi = data.semiTotalGw[i];
        root.querySelector(&#x27;#check-semi&#x27;).innerHTML = `
          &lt;div class=&quot;formula&quot;&gt;Top-4 house stock ${one(houseGw)} GW ÷ SemiAnalysis industry stock ${one(semi)} GW = ${(houseGw/semi).toFixed(2)}×.&lt;/div&gt;
          The gap is directionally plausible because SemiAnalysis is an industry universe while the house line is only the Top 4. It is not a clean validation: the exact SemiAnalysis annual series is hand-keyed, and CY25 is seeded from JPM. Treat the comparison as an envelope, not an anchor.`;

        const gevDcGw = 116*.20;
        root.querySelector(&#x27;#check-gev-gas&#x27;).innerHTML = `
          &lt;div class=&quot;formula&quot;&gt;116 GW under contract × 20% explicitly supporting data centers = ${one(gevDcGw)} GW.&lt;/div&gt;
          This is a genuinely independent observable from GE Vernova’s Q2 FY26 call on 22 Jul 2026. It corroborates that physical orders already exist in the tens of GW. It does not validate ${years[i]}: the contracts run through 2031, include global generation, and are not a one-for-one measure of data-center load.`;

        const impliedGridGw = 5/.3;
        root.querySelector(&#x27;#check-gev-grid&#x27;).innerHTML = `
          &lt;div class=&quot;formula&quot;&gt;&amp;gt;$5bn H1 data-center orders ÷ ~$0.3bn current scope/GW = &amp;gt;${one(impliedGridGw)} GW of directional served scope.&lt;/div&gt;
          Against the all-player ${years[i]} annual model addition of ${one(data.gwAdded[i])} GW, the order-derived scale is ${Math.round(impliedGridGw/data.gwAdded[i]*100)}%. This is a useful scale check but not a precise coverage ratio: order recognition, project timing, GEV share and the management “entitlement” definition differ.`;

        if (i === 0) {
          root.querySelector(&#x27;#check-cost&#x27;).innerHTML = `The workbook’s external cost/GW comparison begins in CY26E. Select CY26E–CY28E to see the same-basis architecture checks.`;
        } else {
          const yr = years[i];
          const rows = [
            [&#x27;Google TPU&#x27;, architectures[&#x27;Google TPU&#x27;][i], streetCost[yr][&#x27;Google TPU&#x27;]],
            [&#x27;Amazon&#x27;, data.capexPerGw[i], streetCost[yr][&#x27;Amazon&#x27;]],
            [&#x27;Meta MTIA&#x27;, architectures[&#x27;Meta MTIA&#x27;][i], streetCost[yr][&#x27;Meta MTIA&#x27;]],
            [&#x27;NVIDIA GPU&#x27;, architectures[&#x27;NVIDIA GPU&#x27;][i], streetCost[yr][&#x27;NVIDIA GPU&#x27;]]
          ];
          root.querySelector(&#x27;#check-cost&#x27;).innerHTML = `&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Architecture&lt;/th&gt;&lt;th&gt;House&lt;/th&gt;&lt;th&gt;Street&lt;/th&gt;&lt;th&gt;Gap&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;${rows.map(r=&gt;`&lt;tr&gt;&lt;td&gt;${r[0]}&lt;/td&gt;&lt;td&gt;${money(r[1])}&lt;/td&gt;&lt;td&gt;${money(r[2])}&lt;/td&gt;&lt;td&gt;${pct(r[1]/r[2]-1)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;
          &lt;/table&gt;&lt;/div&gt;
          &lt;div style=&quot;margin-top:.65rem&quot;&gt;Sources: BofA Justin Post, 7 Jul 2026 for hyperscalers; Morgan Stanley Brian Nowak, 12 Jul 2026 for NVIDIA architecture cost.&lt;/div&gt;`;
        }
      }

      function renderScenario() {
        const capex = Number(root.querySelector(&#x27;#capex-slider&#x27;).value);
        const revenue = Number(root.querySelector(&#x27;#revenue-slider&#x27;).value);
        const util = Number(root.querySelector(&#x27;#util-slider&#x27;).value)/100;
        const effective = revenue*util;
        const payback = capex/effective;
        root.querySelector(&#x27;#capex-slider-value&#x27;).textContent = money(capex) + &#x27;/GW&#x27;;
        root.querySelector(&#x27;#revenue-slider-value&#x27;).textContent = money(revenue) + &#x27;/GW/yr&#x27;;
        root.querySelector(&#x27;#util-slider-value&#x27;).textContent = Math.round(util*100) + &#x27;%&#x27;;
        root.querySelector(&#x27;#payback-output&#x27;).textContent = payback.toFixed(1) + &#x27; years implied payback&#x27;;
        root.querySelector(&#x27;#payback-context&#x27;).textContent = payback &lt;= 2 ? &#x27;Aggressive economics: requires high utilization and/or premium pricing.&#x27; : payback &lt;= 3 ? &#x27;Plausible premium-GPU range, still sensitive to utilization.&#x27; : &#x27;Longer-duration economics; financing and obsolescence matter more.&#x27;;
        root.querySelector(&#x27;#effective-revenue&#x27;).textContent = money(effective) + &#x27;/yr&#x27;;
        root.querySelector(&#x27;#annual-return&#x27;).textContent = (effective/capex*100).toFixed(0) + &#x27;%&#x27;;
        root.querySelector(&#x27;#model-default&#x27;).textContent = (architectures[&#x27;NVIDIA GPU&#x27;][yearIndex]/20).toFixed(1) + &#x27; years&#x27;;
        const cases = [
          [&#x27;Downside&#x27;, capex*1.1/(revenue*.9*util*.8)],
          [&#x27;Selected&#x27;, payback],
          [&#x27;Upside&#x27;, capex*.9/(Math.min(25,revenue*1.1)*Math.min(1,util+0.1))]
        ];
        root.querySelector(&#x27;#sensitivity-band&#x27;).innerHTML = cases.map(c=&gt;`&lt;div&gt;&lt;span class=&quot;context&quot;&gt;${c[0]}&lt;/span&gt;&lt;b&gt;${c[1].toFixed(1)} yrs&lt;/b&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      }

      function renderAll() {
        renderYearSwitch();
        renderMetrics();
        renderStack();
        renderCompanyTabs();
        renderDeployment();
        renderArchitectures();
        renderChecks();
        const capexDefaults = [34.219,37.299,43.116,50.487];
        root.querySelector(&#x27;#capex-slider&#x27;).value = capexDefaults[yearIndex].toFixed(1);
        renderScenario();
      }

      [&#x27;capex-slider&#x27;,&#x27;revenue-slider&#x27;,&#x27;util-slider&#x27;].forEach(id =&gt; {
        root.querySelector(&#x27;#&#x27;+id).addEventListener(&#x27;input&#x27;, renderScenario);
      });
      renderAll();
    })();
  &lt;/script&gt;
&lt;/main&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
