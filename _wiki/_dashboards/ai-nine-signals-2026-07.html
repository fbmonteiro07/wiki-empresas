const fmt0=v=>v==null?'–':Math.round(v).toLocaleString('en-US');

/* ---- generic scales ---- */
function scaler(min,max,a,b){const d=(max-min)||1; return v=>a+(v-min)/d*(b-a);}
function niceTicks(min,max,n=5){
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n+1)||mag*10;
  const lo=Math.ceil(min/step)*step, out=[];
  for(let v=lo;v<=max+1e-9;v+=step) out.push(Math.round(v*100)/100);
  return out;
}

/* ---- multi-series category line chart ---- */
function lineChart({cats, series, W=940, H=330, yfmt=v=>v, ypad=0.08, unit='', endLabels=true}){

      g+=`<text class="tick" x="${xg}" y="${H-P.b+16}" text-anchor="middle">guide</text>`;
    }

  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* ---- OpenRouter full weekly token chart (the whole picture) ---- */
function orChart(){
  const W=940,H=350,P={l:50,r:96,t:26,b:32};
  const n=OR_WEEKLY.length;
  const X=scaler(0,n-1,P.l,W-P.r);
  const Y=scaler(0,70,H-P.b,P.t); /* trillions/week */
  let g='';
  [0,10,20,30,40,50,60,70].forEach(t=>{g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${P.l-7}" y="${Y(t)+3.5}" text-anchor="end">${t}T</text>`;});
  /* month ticks where the month changes (string-sliced, no Date TZ traps) */
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let pm='';
  OR_WEEKLY.forEach((r,i)=>{const m=r[0].slice(5,7); if(m!==pm){pm=m;
    const lb=MN[+m-1]+(m==='01'||i===0?'-'+r[0].slice(2,4):'');
    g+=`<text class="tick" x="${X(i)}" y="${H-P.b+16}" text-anchor="middle">${lb}</text>`;}});
  /* area + line over complete weeks (all but last) */
  const tv=i=>OR_WEEKLY[i][1]/1000;
  let path='', area=`M${X(0).toFixed(1)},${Y(0).toFixed(1)}`;
  for(let i=0;i<n-1;i++){const cmd=(i?'L':'M'); path+=cmd+X(i).toFixed(1)+','+Y(tv(i)).toFixed(1); area+='L'+X(i).toFixed(1)+','+Y(tv(i)).toFixed(1);}
  area+=`L${X(n-2).toFixed(1)},${Y(0).toFixed(1)}Z`;
  g+=`<path d="${area}" fill="var(--c-purple)" opacity=".13"/>`;
  g+=`<path d="${path}" fill="none" stroke="var(--c-purple)" stroke-width="2.2" stroke-linejoin="round"/>`;
  /* final in-progress week: dashed to booked+forecast */
  const proj=(OR_WEEKLY[n-1][1]+OR_WEEKLY[n-1][2])/1000;
  g+=`<line x1="${X(n-2)}" y1="${Y(tv(n-2))}" x2="${X(n-1)}" y2="${Y(proj)}" stroke="var(--c-purple)" stroke-width="2" stroke-dasharray="3 4"/>`;
  g+=`<circle cx="${X(n-1)}" cy="${Y(proj)}" r="4.5" fill="var(--surface)" stroke="var(--c-purple)" stroke-width="2.2" data-tip="${esc('Week of 2026-07-27 (in progress): '+fmt1(OR_WEEKLY[n-1][1]/1000)+'T booked + '+fmt1(OR_WEEKLY[n-1][2]/1000)+'T site forecast ≈ '+fmt1(proj)+'T')}"/>`;
  /* hover targets on every complete week */
  for(let i=0;i<n-1;i++){
    g+=`<circle cx="${X(i)}" cy="${Y(tv(i))}" r="9" fill="transparent" data-tip="${esc('Week of '+OR_WEEKLY[i][0]+': '+fmt1(tv(i))+'T tokens')}"/>`;}
  /* annotations */
  const iPeak=49; /* 2026-07-13, 62.8T */
  g+=`<circle cx="${X(0)}" cy="${Y(tv(0))}" r="3.5" fill="var(--c-purple)"/><text class="anno" x="${X(0)}" y="${Y(tv(0))-9}" text-anchor="start">3.4T/wk</text>`;
  g+=`<circle cx="${X(iPeak)}" cy="${Y(tv(iPeak))}" r="3.5" fill="var(--c-purple)"/><text class="dl" x="${X(iPeak)-6}" y="${Y(tv(iPeak))-9}" text-anchor="end">62.8T/wk</text>`;
  g+=`<text class="dl" x="${X(n-1)+9}" y="${Y(proj)+3}">≈${fmt1(proj)}T proj.</text>`;
  g+=`<text class="anno" x="${X(30)}" y="${Y(46)}" text-anchor="middle">~17–18x in 12 months</text>`;
  g+=`<line class="bl" x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function tabview_or(){
  const rows=[]; for(let i=0;i<OR_WEEKLY.length;i+=4) rows.push([OR_WEEKLY[i][0], fmt1(OR_WEEKLY[i][1]/1000)]);

/* ---- dumbbell growth panels ---- */
function dumbbellPanel(rows, title, sub){
  const W=460,H=30+rows.length*40,P={l:64,r:96,t:16,b:26};

  let g='';
  niceTicks(Math.min(...vals)*0.8,Math.max(...vals)*1.06,4).forEach(t=>{g+=`<line class="gl" x1="${X(t)}" x2="${X(t)}" y1="${P.t}" y2="${H-P.b}"/><text class="tick" x="${X(t)}" y="${H-P.b+15}" text-anchor="middle">${t}%</text>`;});
  rows.forEach((r,i)=>{

    g+=`<text class="dl" x="${P.l-10}" y="${y+4}" text-anchor="end">${r.tk}</text>`;

    g+=`<circle cx="${X(r.feb)}" cy="${y}" r="4.5" fill="var(--muted)" stroke="var(--surface)" stroke-width="2" data-tip="${esc(r.tk+' — consensus as of 2026-01-30: +'+r.feb.toFixed(1)+'%')}"/>`;
    g+=`<circle cx="${X(r.now)}" cy="${y}" r="5.5" fill="${col}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(r.tk+' — consensus now (07-31): +'+r.now.toFixed(1)+'%')}"/>`;
    g+=`<text class="dl" x="${W-P.r+10}" y="${y+4}" style="fill:${col}">${r.feb.toFixed(0)}% → ${r.now.toFixed(0)}%</text>`;});
  return `<div class="chartcard" style="margin-top:0"><div class="chd"><h3>${title}</h3><span class="csub">${sub}</span></div>

}

  S.push({id:'cover', lab:'COVER', html:`<div class="inner" style="padding-top:4vh">
    <div class="eyebrow">Capstone · buyside research wiki · data through 2026-07-31 · sources inline on every datapoint</div>
    <h1 style="margin-top:10px">Is AI demand strengthening<br>at the edge?</h1>
    <p class="sub" style="margin-top:14px; font-size:17px">Nine signals from the last six months — revenue first, then consumption, capacity, economics, and what the market paid for it.
    <b>Eight of the nine got stronger between February and July. The ninth is the bill.</b></p>
    <div class="tilegrid" style="margin-top:22px">
      <div class="tile"><div class="lb">AWS growth, Q2’26</div><div class="v">+36.7%</div><div class="d"><span class="up">fastest in 18 quarters</span>, 5th straight accel · AMZN call 07-30</div></div>
      <div class="tile"><div class="lb">Anthropic ARR</div><div class="v">$9B → $69B</div><div class="d"><span class="up">7.7x</span> in just over 6 months · FundaAI / Yipit 07-10</div></div>
      <div class="tile"><div class="lb">MSFT RPO, sequential add</div><div class="v">+$51B</div><div class="d"><span class="up">all of it ex-frontier labs</span> · F4Q26 call 07-29</div></div>
      <div class="tile"><div class="lb">Street 2027E capex, 4 names</div><div class="v">$540→955B</div><div class="d"><span class="dn">+77% YTD</span> — the cost of the bull case · BBG BEst</div></div>
    </div>
    <div class="src" style="margin-top:22px">Navigate: <kbd>←</kbd> <kbd>→</kbd> or the rail above · hover any datapoint for its source · <kbd>◐</kbd> toggles dark mode.</div>
  </div>`});

  /* S1 — LAB ARR */
  S.push({id:'s1', lab:'1 · LAB ARR', html:`<div class="inner">
    <div class="shead"><div><div class="eyebrow">Signal 1 / 9 — model-layer revenue</div>
    <h2>Lab ARR: the fastest revenue ramp software has ever printed</h2></div>${verdict('up','accelerating')}</div>
    <p class="sub">Coming into 2026 the two big labs expected <b>~$50B combined</b> revenue for the year (Barclays). By July the run-rate was <b>~$100B combined</b> — with Anthropic EBIT-positive.</p>
    <div class="chartcard"><div class="chd"><h3>Frontier-lab run-rate revenue — reported marks, USD bn</h3><span class="csub">hover each point for the source</span></div>
      <div class="legend"><span class="k"><span class="swd" style="--kc:var(--c-purple)"></span>Anthropic</span><span class="k"><span class="swd" style="--kc:var(--c-green)"></span>OpenAI</span></div>
      ${arrChart()}
      ${tabview_arr()}
      <div class="src">Run-rate estimates unless stated by the company. Marks: FundaAI (06-24) · Barclays (06-01) · SemiAnalysis (07-08) · Yipit (07-10) · company Series-H (05-28) · The Information (03-04) · CNBC (07-30).</div>
    </div>
    ${facts([
      {d:'06-01', t:'<b>Three labs to book >$130B of 2026 revenue, ~$200B exit-ARR — “a year ahead” of forecast.</b>', s:'Barclays · Sandler, "AI’s S-Curve Is Steepening", 2026-06-01'},
      {d:'07-08', t:'Anthropic 3Q26E GAAP EBIT ~<b>+$1B — the first profitable frontier lab</b>; ARR/MW $60M vs $16M nine months ago.', s:'SemiAnalysis pre-IPO financials, 2026-07-08'},
      {d:'06-30', t:'<b>>70% of OpenAI + Anthropic ARR is coding</b> — the demand engine is production software work, not chat.', s:'SemiAnalysis "TokenBudgeting", 2026-06-30'},
      {d:'04-14', t:'Independent forward mark: SDK-download signal (>90% correlation, ~6-mo lead) has <b>each lab ~$70B by Sep-26, >$110B by year-end</b>.', s:'Arete Research, 2026-04-14'},
      {d:'—', t:'Valuations repriced with it: OpenAI $300B (Mar-25) → <b>$852B</b> (Mar-26); Anthropic $380B (Feb) → <b>$965B</b> (May) — and a live $3T debate.', s:'Company rounds; @gavinsbaker All-In, 2026-06-27'},
    ])}
    <div class="counter"><div class="ct">Honest counterpoint</div>First contrary read on Anthropic’s curve appeared 07-24 (TickerTrends “growth slowed”, unverified); OpenAI’s July claim (“exceeded all of Q2”) has <b>no hard number yet</b>. The Yipit ~$550M/day net-add run is the live wire to watch. <span class="src">R&Co · Adley 07-24; CNBC 07-30</span></div>
  </div>`});

  /* S2 — TOKENS */
  S.push({id:'s2', lab:'2 · TOKENS', html:`<div class="inner">
    <div class="shead"><div><div class="eyebrow">Signal 2 / 9 — consumption, the longer lens</div>
    <h2>Token consumption: ~17x in twelve months — the full OpenRouter picture</h2></div>${verdict('up','unabated')}</div>
    <p class="sub">Here is the whole OpenRouter picture — every week for the last twelve months, all models. <b>3.4T tokens/week in August 2025 → a 62.8T peak in mid-July 2026, ~17–18x in a year</b> — and the shape is convex: each model wave (GPT-5.5 in April, the Claude/Codex leg in May–June, the Chinese open-weights flood in July) stacked on top of the last instead of replacing it.</p>
    <div class="chartcard"><div class="chd"><h3>OpenRouter — tokens processed per week, all models</h3><span class="csub">the full 52-week series behind “the photo” · hover any week</span></div>
      ${orChart()}
      ${tabview_or()}
      <div class="src">${esc(OR_SRC)}</div>
    </div>
    <div class="grid2">
      <div class="chartcard" style="margin-top:0"><div class="chd"><h3>Gemini API — billions of tokens <i>per minute</i></h3><span class="csub">the cleanest quarterly series Google discloses</span></div>
        ${lineChart({cats:['Q3’25','Q4’25','Q1’26','Q2’26'], series:[{name:'API', css:'--c-orange', pts:TOK_API.map(r=>r.v), note:'paid, first-party model APIs'}], W:460, H:230, yfmt:v=>v+'B', endLabels:false})}
        <div class="src">7 → 10 → 16 → 22 B tokens/min = <b>3.1x in three quarters</b>. “We continue to be supply constrained” — Pichai, Q2’26 call 07-22.</div></div>
      <div class="chartcard" style="margin-top:0"><div class="chd"><h3>Who is past 1 trillion tokens?</h3><span class="csub">customer cohorts, trailing 12 months</span></div>
        ${lineChart({cats:TOK_COHORT.map(r=>r.q), series:[{name:'GCP customers >1T tokens', css:'--c-orange', pts:TOK_COHORT.map(r=>r.v)}], W:460, H:230, yfmt:v=>v, endLabels:false})}
        <div class="src">~150 → 330 → ~500 customers (GOOG calls). Plus >2,000 enterprises past 100B tokens (Q2’26). MSFT Foundry: customers at a 1T-token annualized run-rate <b>4x y/y</b>; 100k Foundry customers, revenue 2x y/y (F4Q26, 07-29).</div></div>
    </div>
    ${facts([
      {d:'—', t:'Google’s own platform meter, before disclosure shifted to the API rate: <b>480T tokens/mo (May-25) → 980T (Jul-25) → ~1.3 quadrillion (Oct-25*)</b>. *Q3’25 transcript unit garbled — verify vs IR.', s:'Alphabet earnings calls, 2025-07-29 / 2025-10-29'},
      {d:'07-2x', t:'OpenRouter annualized run-rate ≈ <b>3.0–3.2 quadrillion tokens</b> (265T/mo metric dated 07-21; the 07-27 refresh printed 246T/mo). Anthropic is <b>~10% of paid tokens but ~46% of platform revenue</b> — premium models carry the economics while open-weights carry the volume.', s:'wiki OpenRouter pipeline (asof 07-27) + site data 07-31'},
      {d:'04-16', t:'“The shift from generative AI in query mode to <b>agentic AI in command-and-action mode</b> is leading to another step-up in the amount of tokens being consumed.”', s:'C.C. Wei, TSMC 1Q26 call, 2026-04-16'},
      {d:'06-30', t:'Meta employees alone consumed <b>>60T Claude tokens in 30 days</b>; enterprise “token budgeting” is emerging — but SemiAnalysis (n>50 enterprises) finds “not a material risk to 2H26 AI budgets”.', s:'SemiAnalysis "TokenBudgeting", 2026-06-30'},
    ])}
    <div class="counter"><div class="ct">Honest counterpoint</div>The last two full weeks printed below the July 13 peak (62.8 → 58.0 → ~57.5T projected) — the first pause since April. One platform, two weeks: noise until it isn’t. The multi-meter slope (this chart + Gemini API + cohorts below) is the signal. <span class="src">OpenRouter site data, captured 2026-07-31</span></div>
  </div>`});

  /* S3 — CLOUD GROWTH */
  S.push({id:'s3', lab:'3 · CLOUD GROWTH', html:`<div class="inner">
    <div class="shead"><div><div class="eyebrow">Signal 3 / 9 — hyperscaler revenue</div>
    <h2>Cloud growth: all three accelerating at once — a first</h2></div>${verdict('up','all 3 accelerating')}</div>
    <p class="sub">AWS went from +17% to +36.7% in five quarters. Google Cloud from +28% to +82% (with a TPU-sales basis note). Azure printed +43% and <b>guided the next quarter higher (~+45% cc)</b>. Every management team says the same word: constrained.</p>
    <div class="chartcard"><div class="chd"><h3>Cloud revenue growth, y/y %</h3><span class="csub">calendar quarters · hover points for source notes</span></div>
      <div class="legend">${CLOUD.map(s=>`<span class="k"><span class="sw" style="--kc:var(${s.css})"></span>${s.name}</span>`).join('')}</div>
      ${lineChart({cats:CG_Q, series:CLOUD, yfmt:v=>v+'%', unit:'', endLabels:true})}
      ${tabview_cloud()}
      <div class="src">${esc(CLOUD_SRC)}</div>
    </div>
    <div class="grid2">
      <div class="pull" style="margin:0">“Demand continues to exceed available supply… you can even see it, I think, in some of the pricing that’s occurring in the spot market for assets.”<span class="who">Amy Hood, CFO — MSFT F4Q26 call, 2026-07-29</span></div>
      <div class="pull" style="margin:0">“Even at [$220B of capex] we will still not have enough capacity to meet all the demand we have in 2026, and I believe this will also be true in 2027. In fact, <b>the demand we already have for 2028 is striking</b>… [AWS] will very possibly be a $1 trillion annual revenue business.”<span class="who">Andy Jassy — AMZN Q2’26 call, 2026-07-30</span></div>
      <div class="pull" style="margin:0">“Our cloud revenue would have been higher if we were able to meet the demand.”<span class="who">Sundar Pichai — GOOG Q1’26 call, 2026-04-29</span></div>
      <div class="pull" style="margin:0">“While we have increased our capacity quite significantly over the past three years, <b>the demand still outpaces that investment</b>.”<span class="who">Anat Ashkenazi, CFO — GOOG Q2’26 call, 2026-07-22</span></div>
    </div>
  </div>`});

  /* S4 — BACKLOG */
  S.push({id:'s4', lab:'4 · BACKLOG', html:`<div class="inner">
    <div class="shead"><div><div class="eyebrow">Signal 4 / 9 — contracted demand</div>
    <h2>Backlog: ~$1.7 trillion of contracted cloud — and the mix is broadening</h2></div>${verdict('up','quality improving')}</div>
    <p class="sub">The bear case said backlog = a few frontier labs recycling capital. The July prints broke that: <b>MSFT’s entire $51B sequential RPO add came from customers outside the frontier labs</b> (+25% y/y ex-OpenAI), and AMZN’s backlog is growing triple digits.</p>
    <div class="chartcard"><div class="chd"><h3>Disclosed cloud backlog / RPO, $bn</h3><span class="csub">three different disclosure bases — labeled, not summed into one line</span></div>
      <div class="legend">${BACKLOG.map(s=>`<span class="k"><span class="swd" style="--kc:var(${s.css})"></span>${s.name}</span>`).join('')}</div>
      ${backlogChart()}
      ${tabview_backlog()}
      <div class="src">MSFT commercial RPO (fiscal quarters mapped to calendar) · GOOG revenue backlog (Q1’26 on includes TPU hardware sales — basis change; “majority still typical GCP contracts”) · AWS backlog (Q3’25 from a paraphrased transcript). Sum at Q2’26 ≈ $1.69T across three different bases — directional, not additive.</div>
    </div>
    ${facts([
      {d:'07-29', t:'MSFT commercial RPO <b>$678B, +84%</b>; +25% ex-OpenAI; “all sequential RPO growth was driven by commitments from customers outside of frontier model companies”; ~30% converts to revenue within 12 months.', s:'Amy Hood, F4Q26 call, 2026-07-29'},
      {d:'07-30', t:'AWS backlog <b>$496B, “growing triple-digits year-over-year”</b> — one quarter after adding the >$100B Anthropic commitment.', s:'AMZN Q2’26 call, 2026-07-30'},
      {d:'07-22', t:'Google Cloud backlog <b>$514B</b>; TPU-sale revenue mostly lands in <b>2027</b> — contracted growth already banked for next year.', s:'Ashkenazi, GOOG Q2’26 call, 2026-07-22'},
      {d:'06-22', t:'Context for the skeptics: ~$300B of Oracle’s $638B RPO is OpenAI, and MSFT’s RPO carries a $250B+ OpenAI commit — <b>the frontier-lab concentration is real, which is exactly why the ex-frontier acceleration matters</b>.', s:'Bernstein "Cloud in the Quarter", 2026-06-22'},
    ])}
  </div>`});

  /* S5 — MARGINS & ROIC */
  S.push({id:'s5', lab:'5 · MARGINS & ROIC', html:`<div class="inner">
    <div class="shead"><div><div class="eyebrow">Signal 5 / 9 — unit economics</div>
    <h2>Margins held while AI scaled — and ROIC now has arithmetic</h2></div>${verdict('up','quantified')}</div>
    <p class="sub">The 2025 fear was AI revenue diluting cloud margins. The opposite printed: <b>Google Cloud’s operating margin tripled while growth tripled</b>, and AWS put up a 39.4% margin — its best in five quarters — alongside its fastest growth in 18. On the “what does a GW earn” question, Morgan Stanley’s July note replaced faith with a model.</p>
    <div class="grid2">
      <div class="chartcard" style="margin-top:0"><div class="chd"><h3>Google Cloud operating margin, %</h3><span class="csub">while revenue growth went 29% → 82%</span></div>
        ${lineChart({cats:CG_Q, series:[{name:'GCP op margin', css:'--c-orange', pts:GCP_MARGIN}], W:460, H:240, yfmt:v=>v+'%', endLabels:false})}
        <div class="src">Alphabet earnings calls, CFO prepared remarks (11.3% → 35.6% over 8 quarters). Wiz adds a “low single-digit” margin headwind from Q2’26 — absorbed.</div></div>
      <div class="chartcard" style="margin-top:0"><div class="chd"><h3>The cloud-margin scoreboard, Q2’26</h3></div>
        <div class="tilegrid" style="grid-template-columns:1fr 1fr">
          <div class="tile"><div class="lb">AWS operating margin</div><div class="v">39.4%</div><div class="d">+650bp y/y (+520 ex-derivative gain) at +36.7% growth · AMZN 07-30</div></div>
          <div class="tile"><div class="lb">GCP operating margin</div><div class="v">35.6%</div><div class="d">from 20.7% a year ago, at +82% growth · GOOG 07-22</div></div>
          <div class="tile"><div class="lb">MSFT AI ARR</div><div class="v">$37B</div><div class="d">+123% y/y (F3Q26; not updated on the F4Q26 call — flag) · 04-29</div></div>
          <div class="tile"><div class="lb">Inference gross margin</div><div class="v">34→65%</div><div class="d">2025 → 2026E across the lab complex · Barclays 06-01</div></div>
        </div></div>
    </div>
    <div class="chartcard"><div class="chd"><h3>What 1 GW earns — Morgan Stanley’s three business models (a planilha)</h3><span class="csub">same standardized gigawatt: 410,256 GB300s · $39bn all-in capex · 21% tax</span></div>
      ${roicChart()}
      <div class="src">${esc(MS_ROIC_SRC)} MS’s conclusion: healthy token returns get competed away at the model layer and <b>capitalized into whoever owns the gigawatts</b> — OW the infra owners (AMZN/GOOGL/MSFT).</div>
    </div>
    ${facts([
      {d:'07-30', t:'The only management-quantified payback of the season: <i class="q">“for servers and networking equipment, on average it takes <b>a little less than three years to break even</b>”</i> — on 5-6yr useful lives, with most AI capacity contracted ≥5 years.', s:'Andy Jassy, AMZN Q2’26 call, 2026-07-30'},
      {d:'05-27', t:'The margin inflection has a named driver: Anthropic-on-Bedrock (~$5.5B run-rate) helped AWS margins inflect <b>+213bp q/q</b>; Anthropic inference GM mid-60s, from −94% in 2024.', s:'SemiAnalysis, 2026-05-27'},
      {d:'04-08', t:'The bear frame, kept honest: blended lab economics ~<b>$10B revenue/GW vs ~$11B compute cost/GW</b> — negative at the headline; the monetized slice earns ~$25B/GW at ~60% GM. Free tiers are the drag (40% of OpenAI inference compute).', s:'Cantor Fitzgerald "Framing the ROIC Debates", 2026-04-08'},
    ])}
    <div class="counter"><div class="ct">Basis discipline</div>MS Model 3’s “ROIC” is a <b>NOPAT margin, not an asset-base return</b> (MS’s own caveat), and its revenue basis skips the 75% utilization haircut of Model 2 — do not quote the three columns as one metric. Models 1–2 ROIC is steady-state year-1 on gross capex, with no model R&D anywhere.</div>
  </div>`});

  /* S6 — TAM */
  S.push({id:'s6', lab:'6 · TAM AHEAD', html:`<div class="inner">
    <div class="shead"><div><div class="eyebrow">Signal 6 / 9 — the demand still in front</div>
    <h2>What if 500 million knowledge workers pay for AI?</h2></div>${verdict('up','option opening')}</div>
    <p class="sub">The base is real: Microsoft alone has <b>>450M paid M365 commercial seats</b> <span class="tagH">HARD</span> (last disclosed F2Q26, growing +6%/yr — ~464M implied today <span class="tagE">ARITHMETIC</span>). Round it to 500M knowledge workers and ask the only question that matters:</p>
    <div class="tilegrid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); margin-top:16px">
      ${WHATIF.map(w=>`<div class="tile" style="padding:18px 20px">
        <div class="lb">…paying <b style="color:var(--ink)">$${w.pm}/month</b></div>
        <div class="v" style="font-size:40px">${w.tam>=1000?'$'+(w.tam/1000).toFixed(1)+'T':'$'+w.tam+'B'}<span style="font-size:15px; color:var(--muted); font-weight:600"> /yr</span></div>
        <div class="d mono">500M × $${w.pm} × 12 = ${w.tam>=1000?'$'+(w.tam/1000).toFixed(1)+'T':'$'+w.tam+'B'} a year</div>
        <div class="d" style="margin-top:6px">${w.note}</div>
      </div>`).join('')}
    </div>
    <div class="src" style="margin-top:8px">Comparisons: combined lab ARR ~$100B — SemiAnalysis 07-08 · MSFT AI ARR $37B — F3Q26 call 04-29 · BofA "AI 2030" AI-DC systems TAM ~$1.7T CY30 — 05-13. The what-if is revenue at the SOFTWARE layer; BofA’s $1.7T is infrastructure spend — the point is the scale match, not the same line item.</div>
    <div class="eyebrow" style="margin-top:20px">…or ask the same question through revenue share</div>
    <div class="tilegrid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); margin-top:8px">
      ${WHATIF2.map(w=>`<div class="tile" style="padding:16px 20px">
        <div class="lb">AI captures <b style="color:var(--ink)">${w.pct}%</b> of listed-world revenue</div>
        <div class="v" style="font-size:34px">$${w.tam}B<span style="font-size:14px; color:var(--muted); font-weight:600"> /yr</span></div>
        <div class="d mono">${w.pct}% × ~$31T combined revenue</div>
        <div class="d" style="margin-top:5px">${w.note}</div>
      </div>`).join('')}
    </div>
    <div class="src" style="margin-top:8px">Revenue base <span class="tagP">PARTIAL</span>: S&P 500 ~$19.4T + Russell 2000 ~$2.3T + STOXX 600 ~$9.4T ≈ <b>$31T</b> of CY26E aggregate revenue — derived from Bloomberg index data 2026-07-31 (BEst CY26 sales-per-share ÷ index level × market cap, per index). Two unrelated frames — <b>seats × price</b> and <b>share of corporate revenue</b> — land in the same $0.3–1.2T corridor; today’s ~$100B of lab ARR is ~0.3% of that revenue base.</div>
    <div class="chartcard"><div class="chd"><h3>Is $50–200/month plausible? It’s already the observed band</h3><span class="csub">$ per user per MONTH, log scale — every rung is a reported number, not a scenario</span></div>
      ${ladderChart()}
      <div class="src">The what-if band ($50–200/mo) sits between the two labs’ CURRENT averages: ChatGPT’s average user pays <b>$25/mo</b> (consumer-heavy mix) and Claude’s average user already pays <b>$211/mo</b> — above the biggest consumer plan (Max 20x, $200/mo). Per-employee spend at AI-forward companies runs 20–40x higher still at list. The what-if is not a fantasy price; it is the corridor between today’s two averages. (FundaAI: "$211/user/month, 8.4x OpenAI’s $25", 2026-06-24.)</div>
    </div>
    <div class="grid2">
      <div class="chartcard" style="margin-top:0"><div class="chd"><h3>Where adoption actually is (the first rung)</h3></div>
        <div class="tilegrid" style="grid-template-columns:1fr 1fr">
          <div class="tile"><div class="lb">M365 Copilot paid seats</div><div class="v sm">>30M</div><div class="d">~6–7% of the base; net adds <span class="up">2x q/q</span> · F4Q26</div></div>
          <div class="tile"><div class="lb">Copilot $ today (at $30 list)</div><div class="v sm">≈$10.8B/yr</div><div class="d">Bernstein est. realized ~$6–7B — the $600B what-if is ~60x this</div></div>
        </div>
        <div class="src" style="margin-top:6px">The gap between the first rung and the what-if IS the slide: this TAM is opened by attach × price-per-user, and both just moved (seats 15M→30M in six months; pricing now usage-based).</div></div>
      <div class="chartcard" style="margin-top:0"><div class="chd"><h3>Why the ceiling moved</h3></div>
        ${facts([
          {d:'07-29', t:'<b>M365 Copilot >30M paid seats, net adds more than doubled q/q</b>; customers with >50k seats up >7x y/y; NHS 505k / HSBC 200k Copilot seats; EY moved 400k employees to the E7 bundle.', s:'MSFT F4Q26 call, 2026-07-29'},
          {d:'07-29', t:'<b>GitHub Copilot: 50M users</b>; June shift to usage-based billing → “significant consumption revenue… Copilot revenue accelerated over 60% q/q”.', s:'Nadella, F4Q26 call, 2026-07-29'},
          {d:'04-30', t:'“The moment the shift to usage-based pricing suddenly shifted” — the seat→usage inflection was called in April; it printed in July.', s:'UBS · Keirstead, 2026-04-30'},
        ])}
      </div>
    </div>
    <div class="counter"><div class="ct">Guardrail — keep the what-if honest</div>The math is linear and assumes <b>all 500M pay</b> — that is the point of a what-if, not a forecast: half the users or half the price is half the TAM. Direction check: the $50/mo case ($300B/yr) ≈ 1.5x what the whole lab complex is expected to exit 2026 at (~$200B ARR — Barclays 06-01), and ~30x today’s realized Copilot (~$6–7B, Bernstein est.) — i.e. the upside lives in <b>attach × price-per-user</b>, and both are moving: seats 15M→30M in six months, and the usage-based template landed at GitHub Copilot (revenue +60% q/q post-shift) and Dynamics (usage credits +4x q/q) — per-employee spend at AI-forward companies already runs 20–40x above the $200/mo rung at list. <span class="tagE">Illustrative, not a house estimate.</span></div>
  </div>`});

  /* S7 — CAPEX INTENSITY */
  S.push({id:'s7', lab:'7 · CAPEX INTENSITY', html:`<div class="inner">
    <div class="shead"><div><div class="eyebrow">Signal 7 / 9 — the cost of the bull case</div>
    <h2>Capex intensity: the AI clouds now out-spend the foundry model</h2></div>${verdict('watch','the bill')}</div>
    <p class="sub">Capex-to-revenue was ~15–25% for this group two years ago. Street numbers now put <b>GOOG at ~56% and META at ~63% of revenue in 2027</b> — beyond TSMC at peak build (~36% in 2026). The demand signals (slides 1–6) are what make this financeable; the FCF line is where it shows.</p>
    ${intensityPanels()}
    ${facts([
      {d:'06-16', t:'The reference frame: top-4 capex <b>~$410B 2025A → ~$700–725B 2026E (+75%) → ~$1.1T 2027E</b>; $5.5T total AI capex through 2030, $4.1T debt-financed.', s:'JPM · Sur, "AI Capex 2.0", 2026-06-16'},
      {d:'07-26', t:'The cleanest measure of the rewrite: aggregate 2026–28 capex across AMZN/META/GOOG/MSFT/ORCL revised <b>$1.3T → $3.4T (+166%) in twelve months</b>.', s:'BofA · Fenske, 2026-07-26'},
      {d:'07-22/30', t:'The FCF consequence, July prints: GOOG quarterly FCF <b>−$5.9B</b>; AMZN <b>−$9B</b>; MSFT stayed positive (<b>+$19.6B</b> Q4) — UBS’s modeled −$21B FY27 year didn’t arrive; FY27 guided FCF-positive.', s:'2Q26 prints; UBS · Keirstead 04-30 → 07-29 post-mortem'},
      {d:'07-06', t:'The financing layer is now its own market: <b>$1.3T of IG supply in H1</b> (= ’22+’23+’24 combined); NVDA’s backstop guarantees $77.5B → $175.3B; AI debt >$7T by 2029 projected.', s:'GS · Crook 07-04; SemiAnalysis 07-06'},

    <div class="counter"><div class="ct">The line to respect</div>“The era of 20%+ surprises to hyperscaler capex expectations is likely over… demand signals are intact — but no longer arriving as major capex raises.” Good for hyperscaler ROI; removes the perpetual re-rating fuel for semis. <b>Watch guides, not vibes.</b> <span class="src">Rothschild & Co Redburn · Adley, 2026-07-30</span></div>
  </div>`});

  /* S8 — RE-RATING */
  S.push({id:'s8', lab:'8 · MULTIPLE', html:`<div class="inner">
    <div class="shead"><div><div class="eyebrow">Signal 8 / 9 — what the market paid for it</div>
    <h2>The re-rating that didn’t happen: the rally was earned in estimates</h2></div>${verdict('up','earned, not paid')}</div>
    <p class="sub">Since end-January, seven of these eight names are up 5–22% — while <b>forward P/Es are flat to LOWER for six of the eight</b>. Prices followed the estimates (below), not the multiple. The exceptions tell the story too: META fell 22% and de-rated ~20% on the “trust me” quarter; ASML round-tripped a spike to ~45x in May back to ~30x as 2027 became order-covered fact.</p>
    <div class="chartcard"><div class="chd"><h3>Blended-forward P/E, weekly — Jul-2025 → Jul-2026</h3><span class="csub">panel header: price change · P/E change over Feb→Jul 2026</span></div>
      ${peSparks()}
    </div>
    <div class="grid2">
      ${dumbbellPanel(G27,'Consensus CY2027 revenue growth','what Street underwrote for 2027: Feb vs now')}
      ${dumbbellPanel(G28,'Consensus CY2028 revenue growth','2028: raised nearly everywhere too')}
    </div>
    <div class="src" style="margin-top:8px">${esc(RERATE_SRC)}</div>
    ${facts([
      {d:'07-31', t:'CY27 consensus revenue was rewritten up <b>+4% (META) to +42% (AVGO)</b> in six months; CY27 growth rates re-underwritten by +2 to +16pts. NVDA’s CY28 growth marked DOWN (27%→23%) — big-number conservatism, not weakness.', s:'BBG BEst, Feb-vintage vs 07-31'},
      {d:'07-29', t:'MSFT (fiscal basis, excluded from the CY panel): Street has <b>FY27 +17.6% and FY28 +19.4%</b> on 1FY/2FY overrides — high-teens growth SUSTAINED into the out-years (blended-forward windows read ~+19.5% both years; no deceleration on either basis).', s:'BBG BEst snapshots, 2026-07-31'},
      {d:'07-28', t:'The tape’s own discipline check: KLAC beat, raised WFE to “low $150B” — and fell 7–9%, because buyside numbers were already higher. <b>Where estimates lead prices, surprises must keep landing.</b>', s:'Barclays · Rand, 2026-07-28'},
    ])}
  </div>`});

  /* S9 — TSM & ASML */
  S.push({id:'s9', lab:'9 · TSM & ASML', html:`<div class="inner">
    <div class="shead"><div><div class="eyebrow">Signal 9 / 9 — the longest lead times in the chain</div>
    <h2>TSMC & ASML: the deepest layer says this runs through 2028–30</h2></div>${verdict('up','cycle extends')}</div>
    <p class="sub">Foundry and litho sit 2–7 years ahead of demand by construction. Both raised twice in six months, and both are now spending for <b>2028–29 supply</b> — TSMC’s words, not ours.</p>
    <div class="grid2">
      <div class="chartcard" style="margin-top:0"><div class="chd"><h3>TSMC — FY26 guide walk</h3><span class="csub">USD revenue growth, guided</span></div>
        <div class="steps">${TSM_STEPS.map(s=>`<div class="step"><span class="sd">${s.d}</span><span class="sv">${s.v}</span><span class="sn">${s.n}</span></div>`).join('')}</div></div>
      <div class="chartcard" style="margin-top:0"><div class="chd"><h3>ASML — FY26 guide walk</h3><span class="csub">net sales, guided</span></div>
        <div class="steps">${ASML_STEPS.map(s=>`<div class="step"><span class="sd">${s.d}</span><span class="sv">${s.v}</span><span class="sn">${s.n}</span></div>`).join('')}</div></div>
    </div>
    <div class="grid2">
      <div class="pull" style="margin:0">“I believe from this day on, all the way to probably 2029, 2030, the demand is very strong. Whether in between there’s a dip or not, I’m not very sure. But the trend is so robust that I believe we are witnessing a kind of a new industry… called the AI industry.”<span class="who">C.C. Wei — TSMC 2Q26 call, 2026-07-16 (in January: “it looks like it’s going to be endless… for many years to come”)</span></div>
      <div class="pull" style="margin:0">“Customer demand remains very strong, with visibility now extending several years into the future… the rapid growth of AI-related demand in advanced logic and DRAM is accelerating the move toward more advanced lithography solutions and increasing lithography intensity.”<span class="who">Christophe Fouquet — ASML Q2’26 call, 2026-07-15</span></div>
    </div>
    ${facts([
      {d:'07-16', t:'TSMC raised capex to <b>$60–64B</b>, added <b>+$100B in Arizona (total $265B, “four or more” fabs)</b> + 13 fabs in Taiwan; “capex in the next three years will be <b>even more</b> significantly higher than the past three”. And the planning horizon is the tell: developing a node, building and ramping its capacity “now takes <b>five to seven years. There are no shortcuts</b>” — the business is being committed on 2031-era horizons.', s:'TSMC 2Q26 call, 2026-07-16'},
      {d:'01-15', t:'The spend is explicitly for the out-years: “even [as] we start to spend the $52–56B, the contribution to this year is almost none… <b>we are actually looking for 2028, 2029 supply</b>”.', s:'C.C. Wei, TSMC 4Q25 call, 2026-01-15'},
      {d:'07-15', t:'ASML: memory system sales <b>+75% y/y</b>; Low-NA EUV capacity <b>+30% in 2027</b> (~85 units — broker arithmetic ASML’s IR later confirmed: “30 plus 30 takes us to 110 units, roughly” for 2028) and 2027 “<b>close to being fully covered with orders</b>” (Dassen); customers’ LTAs with their own customers give “quite unprecedented visibility”.', s:'ASML Q2’26 call, 2026-07-15; ASML IR small-group, 07-20'},
      {d:'07-16', t:'N2 at <b>3% of wafer revenue in its first quarter</b>; HPC 66% of revenue; the ≤3nm demand-supply gap: “the gap is really big… a very big gap” — and “we do not foresee any bottlenecks to our capacity expansion plans”.', s:'TSMC 2Q26 call, 2026-07-16'},
    ])}
    <div class="counter"><div class="ct">The other side, kept on the page</div>Ex-Samsung foundry EVP (06-30): WFE passes $200B but <b>“never $300B”</b>; ASML capped ~140–150 EUV/yr by Zeiss mirrors; memory LTAs “not worth the toilet paper they’re written on”. Note what July did to this: ASML’s own 2028 plan (~110 units) sits <b>inside</b> the skeptic’s cap — the cap doesn’t bind the current path — and Bernstein’s GW-frame (07-20) made “$300B+ seemingly doable” with a physical unit chain. Two caveats stay live: ASML no longer discloses bookings (“we don’t report bookings anymore” — IR, 07-20; visibility is asserted, not printed), and its IR softened “fully booked” to “<b>not completely booked… holes in the list</b>”. <span class="src">expert call 06-30; Bernstein · Rasgon 07-20; ASML IR 07-20</span></div>
  </div>`});

  /* VERDICT */
  S.push({id:'verdict', lab:'VERDICT', html:`<div class="inner">
    <div class="eyebrow">The nine signals, scored</div>
    <h2>Verdict: strengthening at the edge — and increasingly paid-for</h2>
    <div style="margin-top:14px">
      <div class="scorerow hd"><span>#</span><span>Signal</span><span>Where it stood (≈Feb)</span><span>Where it stands (Jul)</span><span>Call</span></div>
      ${SCORE.map(r=>`<div class="scorerow"><span class="n">${r.n}</span><b>${r.sig}</b><span class="cell">${r.feb}</span><span class="cell">${r.jul}</span><span>${verdict(r.v==='up'?'up':r.v==='watch'?'watch':'flat', r.lb)}</span></div>`).join('')}
    </div>
    <p class="sub" style="margin-top:18px">The through-line: <b>demand evidence strengthened on every independent meter</b> — revenue, tokens, cloud P&L, contracts, unit economics, and the supply chain’s own capacity bets. The two disciplines to keep: the spend is now so large that FCF and funding mix are load-bearing (signal 7), and the tape has started refusing to pay for what it already knows (KLAC beat-raised-fell; Samsung’s record traded flat). Acceleration is necessary but no longer sufficient — <b>surprise is the currency now</b>.</p>
    ${facts([
      {d:'08-04', t:'<b>AMD Q2 print</b> — structure of the next GW-scale deal; MI450 momentum into 1H27.', s:'catalysts ledger'},
      {d:'08-26', t:'<b>NVDA Q2 FY27</b> — guided $91B ±2%; hyperscaler-vs-ACIE mix optics under the new segmentation.', s:'NVDA Q1 FY27 call, 2026-05-20'},
      {d:'Oct', t:'<b>META Q3</b> — the first FY27 capex guide ($142B reported-basis vs $180–200B gross builds vs $243B JPM); track cash PP&E, not reported capex. Plus: does the Rothschild “no more 20% surprises” line hold across the group’s Q3 guides?', s:'META 2Q26 post-mortems, 2026-07-30'},
      {d:'live', t:'<b>Lab net-adds</b> — Yipit’s ~$550M/day Anthropic run and OpenAI’s July claim getting a hard number are the highest-frequency confirmations either way.', s:'Yipit 07-10; CNBC 07-30'},
    ])}
    <footer class="note">Built from the Capstone research wiki (primary transcripts, sell-side notes, expert calls, house models), 2026-07-31. Attribution rule: broker/analyst or primary source + date on every datapoint; consensus = Bloomberg BEst; ARR figures are run-rate estimates unless company-stated; GW bases kept separate (facility ≠ IT-load); backlog bases labeled, not summed. Companion chronological deck: ai-recap-feb-jul-2026.html. Not investment advice.</footer>
  </div>`});

/* ============ MECHANICS ============ */
let SLIDES=[], cur=0;
function mount(){
  SLIDES=buildSlides();
  deck.innerHTML=SLIDES.map(s=>`<section class="slide" id="s-${s.id}" role="tabpanel">${s.html}</section>`).join('');
  scrub.innerHTML=SLIDES.map((s,i)=>`<button role="tab" data-i="${i}">${s.lab}</button>`).join('');
  scrub.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) go(+b.dataset.i);});
  sync(0);
}
function go(i){cur=Math.max(0,Math.min(SLIDES.length-1,i)); deck.scrollTo({left:cur*deck.clientWidth,behavior:'smooth'}); sync(cur);}
function sync(i){cur=i; $$('#scrub button').forEach((b,j)=>b.classList.toggle('on',j===i));}
deck.addEventListener('scroll',()=>{const i=Math.round(deck.scrollLeft/deck.clientWidth); if(i!==cur)sync(i);},{passive:true});
$('#prevB').onclick=()=>go(cur-1); $('#nextB').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);
  if(e.key==='Home')go(0); if(e.key==='End')go(SLIDES.length-1);});
addEventListener('resize',()=>{deck.scrollTo({left:cur*deck.clientWidth});});
$('#themeBtn').onclick=()=>{
  const r=document.documentElement, curT=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.dataset.theme=curT==='dark'?'light':'dark';};
/* tooltip */
const tip=$('#tip');
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]'); if(!t){tip.classList.remove('on');return;}
  tip.textContent=t.dataset.tip; tip.classList.add('on');});
document.addEventListener('mousemove',e=>{
  if(!tip.classList.contains('on'))return;
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(innerWidth-w-12,e.clientX+14)+'px';
  tip.style.top=Math.max(8,Math.min(innerHeight-h-10,e.clientY-h-12))+'px';});
mount();

</script>
