'use strict';
const ScoreReturns = (() => {
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const number = (v, digits=1) => Number.isFinite(v) ? v.toLocaleString('en-US', {minimumFractionDigits:digits, maximumFractionDigits:digits}) : '—';
  const pct = v => Number.isFinite(v) ? `${v > 0 ? '+' : ''}${number(v)}%` : '—';
  const pp = v => Number.isFinite(v) ? `${v > 0 ? '+' : ''}${number(v)} pp` : '—';
  const sign = v => Number.isFinite(v) ? (v >= 0 ? 'sr-positive' : 'sr-negative') : '';
  const range = s => s?.n ? `${pct(s.p10)} to ${pct(s.p90)}` : '—';
  const status = s => !s?.n ? 'No completed analogs' : s.n < 20 ? 'Thin sample · descriptive only' : 'Historical analog · not a forecast';

  function currentOutcomes(company, results) {
    if (company.band == null) return '';
    return `<div class="sr-kpis" aria-label="Current score band: own-stock historical outcomes">${[5,10].map(h=>{
      const s=results[String(h)].bands[company.band], enough=s.n>=10;
      return `<div><span>${h===5?'1 week · 5-session hold':'2 weeks · 10-session hold'}</span><strong class="${enough?sign(s.mean):''}">${enough?pct(s.mean):'Insufficient history'}</strong><p>${enough?'Historical mean · median '+pct(s.median):'Fewer than 10 completed observations'}</p><p>Up ${enough?number(s.up_pct,0)+'%':'—'} · N=${s.n}</p>${enough?`<p>P10–P90: ${range(s)}</p><p>vs own all-band mean: ${pp(s.vs_baseline)}</p>`:''}<small>${status(s)}</small></div>`;
    }).join('')}</div>`;
  }

  function preview(data, ticker) {
    const c = data?.companies?.[ticker];
    if (!c) return '';
    return `<article class="card section-space sr-inline"><div class="card-head"><div><h2>Score → subsequent returns</h2><p>${esc(ticker)}'s own historical analogs · prices through ${esc(data.meta.price_asof)}</p></div><a class="btn" href="score-returns.html#ticker=${encodeURIComponent(ticker)}">Explore all score bands →</a></div><div class="card-body"><p>${c.band == null ? 'The current score is unavailable; no neutral score or return estimate is substituted.' : `Current attention &amp; sentiment score <b>${number(c.score)} / 100</b> · band <b>${esc(data.meta.bands[c.band])}</b>.`}</p>${currentOutcomes(c,c.results.all)}<p class="inline-note">Entry at the next session's close. The score includes attention as well as tone; specialist-sales judgments are not backfilled into its history. P10–P90 shows historical dispersion; these are observed conditional returns, not expected-return forecasts. <a href="score-returns.html#ticker=${encodeURIComponent(ticker)}">View all score bands, confidence intervals and 2026 stability.</a></p></div></article>`;
  }

  function chart(result, selectedBand, horizon, bands) {
    const rows = result.bands;
    const vals = rows.flatMap(s=>[s.mean,...(s.ci95||[])]).filter(Number.isFinite);
    vals.push(result.baseline.mean||0,0);
    let lo=Math.min(...vals), hi=Math.max(...vals), pad=Math.max(1,(hi-lo)*.16);
    lo-=pad; hi+=pad;
    const w=620,h=310,l=62,r=22,t=30,b=56;
    const x=i=>l+(i+.5)*(w-l-r)/5, y=v=>t+(hi-v)/(hi-lo)*(h-t-b);
    let body='';
    if (selectedBand!=null) body+=`<rect x="${x(selectedBand)-43}" y="${t}" width="86" height="${h-t-b}" rx="10" fill="#729cff" opacity=".09"/>`;
    for(let i=0;i<=4;i++){
      const v=lo+(hi-lo)*i/4;
      body+=`<line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}" stroke="#293a50"/><text x="${l-10}" y="${y(v)+4}" text-anchor="end" fill="#9caec5" font-size="12">${pct(v)}</text>`;
    }
    body+=`<line x1="${l}" x2="${w-r}" y1="${y(0)}" y2="${y(0)}" stroke="#94a6be" opacity=".65"/>`;
    if(Number.isFinite(result.baseline.mean)) body+=`<line x1="${l}" x2="${w-r}" y1="${y(result.baseline.mean)}" y2="${y(result.baseline.mean)}" stroke="#e2b978" stroke-dasharray="5 5"/>`;
    rows.forEach((s,i)=>{
      const xx=x(i),col=s.mean>=0?'#64d9c3':'#fa91a8';
      body+=`<text x="${xx}" y="${h-31}" text-anchor="middle" fill="#cfdaeb" font-size="12">${esc(bands[i])}</text><text x="${xx}" y="${h-12}" text-anchor="middle" fill="#9caec5" font-size="11">N=${s.n}</text>`;
      if(!s.n) return;
      const tip=`${bands[i]} | Mean ${pct(s.mean)} | 95% mean interval ${s.ci95?s.ci95.map(pct).join(' to '):'insufficient blocks'} | Median ${pct(s.median)} | Up ${number(s.up_pct)}% | N=${s.n}, ${s.dates} dates, ${s.stocks} stocks`;
      body+=`<g tabindex="0" role="img" aria-label="${esc(tip)}"><title>${esc(tip)}</title>`;
      if(s.ci95)body+=`<line x1="${xx}" x2="${xx}" y1="${y(s.ci95[0])}" y2="${y(s.ci95[1])}" stroke="${col}" stroke-width="2"/><path d="M${xx-7},${y(s.ci95[0])}h14 M${xx-7},${y(s.ci95[1])}h14" stroke="${col}" fill="none"/>`;
      body+=`<circle cx="${xx}" cy="${y(s.mean)}" r="6" fill="${col}" stroke="#101c2e" stroke-width="2"/><text x="${xx}" y="${Math.max(t+10,y(s.ci95?s.ci95[1]:s.mean)-11)}" text-anchor="middle" fill="${col}" font-size="13" font-weight="600">${pct(s.mean)}</text></g>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${horizon}-session mean subsequent return by score band, with 95 percent mean intervals"><title>Score and ${horizon}-session returns</title>${body}</svg>`;
  }

  function render(data, state) {
    const pooled=state.ticker==='universe', company=data.companies[state.ticker];
    const scope=pooled?data.pooled:company.results, results=scope[state.period];
    const currentBand=pooled?null:company.band;
    const label=pooled?'USD-quoted covered universe':state.ticker;
    const selected=currentBand==null?null:results['10'].bands[currentBand];
    const options=Object.keys(data.companies).sort().map(t=>`<option value="${esc(t)}" ${state.ticker===t?'selected':''}>${esc(t)} · ${esc(data.companies[t].name)}</option>`).join('');
    return `<div class="sr-header"><div><div class="sr-eyebrow">SENTIMENT RADAR / FORWARD RETURNS</div><h1>What followed a similar score?</h1><p>One- and two-week outcomes, measured after the signal. Higher scores do not automatically imply higher returns.</p></div><span class="sr-badge">Prices ${esc(data.meta.price_asof)}</span></div>
      <div class="sr-toolbar"><label>Company / reference universe<select data-sr="ticker"><option value="universe" ${pooled?'selected':''}>USD universe · pooled reference</option>${options}</select></label><label>Historical sample<select data-sr="period"><option value="all" ${state.period==='all'?'selected':''}>All retained history</option><option value="pre2026" ${state.period==='pre2026'?'selected':''}>2024–25 · completed by year-end</option><option value="2026" ${state.period==='2026'?'selected':''}>2026 · stability check</option></select></label><button class="sr-button" data-sr-export>Export table CSV ↓</button></div>
      <div class="sr-context"><div><b>${esc(label)}</b><p>${pooled?`${data.meta.sampled_usd_names} names with historical eligible scores. Event-weighted pooled reference; this is not an asset-specific forecast.`:company.band==null?'No current eligible score. Historical bands remain available.':`Current score <b>${number(company.score)} / 100</b> · band <b>${esc(data.meta.bands[company.band])}</b>. Highlighted band links today’s score to this asset’s own past observations.`}</p></div><div><span class="sr-label">${pooled?'Completed 2-week observations':'Current-band 2-week observations'}</span><strong>${pooled?results['10'].baseline.n:selected?.n||0}</strong><small>${pooled?`${results['10'].baseline.dates} signal dates; stocks on the same date are correlated`:status(selected)}</small></div></div>
      ${!pooled&&company.currency!=='USD'?`<div class="sr-note">${esc(company.currency)} price returns sampled on the retained US-session calendar. Local exchange sessions and time zones differ; QQQ-relative returns are omitted.</div>`:''}
      ${!pooled?currentOutcomes(company,results):''}
      <div class="sr-charts">${[5,10].map(h=>`<article class="sr-card"><div class="sr-card-head"><h2>${h===5?'1 week':'2 weeks'} <span>${h}-session hold</span></h2><p>Mean return · whiskers = 95% interval for the mean</p></div>${chart(results[String(h)],currentBand,h,data.meta.bands)}<div class="sr-chart-foot"><span class="sr-dash"></span>All-band mean ${pct(results[String(h)].baseline.mean)} <span>· same sample and horizon</span></div></article>`).join('')}</div>
      <article class="sr-card"><div class="sr-card-head"><h2>Score band → subsequent price return</h2><p>${esc(label)} · P10–P90 shows historical dispersion, not a future probability guarantee. Highlight = current score band.</p></div><div class="sr-scroll"><table class="sr-table"><thead><tr><th rowspan="2">Score / 100</th><th colspan="5">1 week · 5 sessions</th><th colspan="5">2 weeks · 10 sessions</th></tr><tr>${[5,10].map(()=>'<th>Mean</th><th>Median</th><th>Up</th><th>P10–P90</th><th>N</th>').join('')}</tr></thead><tbody>${data.meta.bands.map((name,i)=>`<tr class="${i===currentBand?'sr-current':''}"><th>${esc(name)}${i===currentBand?' <span>● current</span>':''}</th>${[5,10].map(h=>{const s=results[String(h)].bands[i];return `<td class="${sign(s.mean)}">${pct(s.mean)}</td><td>${pct(s.median)}</td><td>${s.n?number(s.up_pct,0)+'%':'—'}</td><td class="sr-range">${range(s)}</td><td title="${esc(status(s))}">${s.n}${s.n>0&&s.n<20?'*':''}</td>`;}).join('')}</tr>`).join('')}<tr class="sr-baseline"><th>All bands</th>${[5,10].map(h=>{const s=results[String(h)].baseline;return `<td>${pct(s.mean)}</td><td>${pct(s.median)}</td><td>${s.n?number(s.up_pct,0)+'%':'—'}</td><td class="sr-range">${range(s)}</td><td>${s.n}</td>`;}).join('')}</tr></tbody></table></div><p class="sr-foot">* Fewer than 20 outcomes: thin descriptive sample. Twenty observations is a display threshold, not proof of predictive reliability. Zero outcomes remain unavailable.</p></article>
      <div class="sr-bottom"><article class="sr-card"><div class="sr-card-head"><h2>Does it beat the reference?</h2><p>${pooled?'Same-date QQQ price returns, USD names only.':'Conditional mean minus all-band mean for this company; QQQ comparison only for USD prices.'}</p></div><div class="sr-scroll"><table class="sr-table"><thead><tr><th>Band</th><th>1w vs baseline</th><th>2w vs baseline</th><th>1w vs QQQ</th><th>2w vs QQQ</th></tr></thead><tbody>${data.meta.bands.map((b,i)=>`<tr class="${i===currentBand?'sr-current':''}"><th>${esc(b)}</th>${[5,10].map(h=>`<td>${pp(results[String(h)].bands[i].vs_baseline)}</td>`).join('')}${[5,10].map(h=>`<td>${pp(results[String(h)].bands[i].excess_qqq)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="sr-foot">A positive raw return can come from a rising market. These differences are descriptive, not risk-adjusted alpha or a causal effect.</p></article><article class="sr-card sr-method"><h2>Read the comparison correctly</h2><ol><li><b>Signal then return.</b> Score at t; enter at the close of t+1; exit at t+6 / t+11. The “week” starts at entry, not at the signal close.</li><li><b>No duplicated holding windows within a stock.</b> First valid score, then the next valid score at least 11 US sessions later. Both horizons share this sampling rule.</li><li><b>Three different measures.</b> The 0–100 score blends attention acceleration, unusual attention, improving tone and positive agreement. It is not pure X tone, CNN Fear &amp; Greed, or a spec-sales rating.</li><li><b>Uncertainty is visible.</b> Mean intervals resample 20-session calendar blocks with all stocks together. Individual return dispersion is much wider than uncertainty around an average.</li></ol><details><summary>Sources and limits</summary><p>${esc(data.meta.source)}. Retained price/score data through ${esc(data.meta.price_asof)}; first sampled signal ${esc(data.meta.signal_start)}.</p><p>Score weights: 35% acceleration, 30% unusual attention, 20% tone improvement, 15% positive-share rank. Historical specialist commentary is not numerically scored in this study.</p><p>${esc(data.meta.periods)}</p><p>${esc(data.meta.uncertainty)}</p><ul>${data.meta.limitations.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details></article></div>`;
  }

  function csv(data,state) {
    const results=(state.ticker==='universe'?data.pooled:data.companies[state.ticker].results)[state.period];
    const rows=[['scope','period','band','sessions','mean_pct','median_pct','up_pct','p10_pct','p90_pct','n','signal_dates','stocks','ci95_low','ci95_high','vs_baseline_pp','vs_qqq_pp']];
    for(const h of [5,10])results[String(h)].bands.forEach((s,i)=>rows.push([state.ticker,state.period,data.meta.bands[i],h,s.mean,s.median,s.up_pct,s.p10,s.p90,s.n,s.dates,s.stocks,s.ci95?.[0],s.ci95?.[1],s.vs_baseline,s.excess_qqq]));
    return rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');
  }

  function mount(root,data,initial={}) {
    const state={ticker:'universe',period:'all',...initial};
    if(state.ticker!=='universe'&&!data.companies[state.ticker])state.ticker='universe';
    const draw=()=>{
      root.innerHTML=render(data,state);
      root.querySelectorAll('[data-sr]').forEach(el=>el.onchange=()=>{state[el.dataset.sr]=el.value;draw();});
      root.querySelector('[data-sr-export]').onclick=()=>{
        const url=URL.createObjectURL(new Blob(['\ufeff'+csv(data,state)],{type:'text/csv;charset=utf-8'}));
        const a=document.createElement('a');a.href=url;a.download=`score-returns-${state.ticker}-${state.period}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
      };
    }; draw();
  }
  return {render,preview,chart,csv,mount};
})();
if(typeof module!=='undefined')module.exports=ScoreReturns;

(async()=>{const root=document.getElementById('score-study');try{const bytes=Uint8Array.from(atob(document.getElementById('score-snapshot').textContent.trim()),c=>c.charCodeAt(0));const data=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());const ticker=new URLSearchParams(location.hash.slice(1)).get('ticker')||'universe';ScoreReturns.mount(root,data,{ticker});}catch(e){root.textContent='Unable to load this offline study. Use a current Edge, Chrome or Firefox. '+e.message;}})();
</script></body></html>
