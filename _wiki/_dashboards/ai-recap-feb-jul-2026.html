<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>AI — The Last Six Months (Feb–Jul 2026)</title>
<style>
  :root{
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,.10);
    --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10);
    --c-labs:#2a78d6; --c-capex:#eb6834; --c-chips:#1baf7a; --c-mem:#eda100;
    --c-semicap:#e87ba4; --c-power:#008300; --c-macro:#4a3aa7;
    --good:#006300; --bad:#d03b3b;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
      --accent:#3987e5; --accent-soft:rgba(57,135,229,.14);
      --c-labs:#3987e5; --c-capex:#d95926; --c-chips:#199e70; --c-mem:#c98500;
      --c-semicap:#d55181; --c-power:#008300; --c-macro:#9085e9;
      --good:#0ca30c; --bad:#e66767;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-soft:rgba(57,135,229,.14);
    --c-labs:#3987e5; --c-capex:#d95926; --c-chips:#199e70; --c-mem:#c98500;
    --c-semicap:#d55181; --c-power:#008300; --c-macro:#9085e9;
    --good:#0ca30c; --bad:#e66767;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.5; overflow:hidden;
  }
  .eyebrow{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  em.q{font-family:Georgia,'Times New Roman',serif; font-style:italic;}

  /* ---------- shell ---------- */
  #shell{height:100vh; display:flex; flex-direction:column;}
  header#bar{
    flex:0 0 auto; display:flex; align-items:center; gap:14px;
    padding:10px 18px; border-bottom:1px solid var(--grid); background:var(--page);
  }
  #bar .ttl{font-weight:700; font-size:14px; white-space:nowrap;}
  #bar .ttl span{color:var(--muted); font-weight:500;}
  #scrub{display:flex; gap:2px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none;}
  #scrub button{
    appearance:none; border:0; background:transparent; color:var(--muted);
    font:600 11px/1 system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.06em;
    padding:8px 9px 10px; cursor:pointer; border-radius:6px; position:relative; white-space:nowrap;
  }
  #scrub button:hover{background:var(--accent-soft); color:var(--ink2);}
  #scrub button.on{color:var(--ink);}
  #scrub button.on::after{content:""; position:absolute; left:9px; right:9px; bottom:4px; height:3px; border-radius:2px; background:var(--accent);}
  .navbtn{
    appearance:none; border:1px solid var(--grid); background:var(--surface); color:var(--ink2);
    width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:15px; flex:0 0 auto;
  }
  .navbtn:hover{border-color:var(--baseline); color:var(--ink);}
  #themeBtn{width:auto; padding:0 10px; font-size:12px;}

  /* filter row */
  #filters{
    flex:0 0 auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:8px 18px; border-bottom:1px solid var(--grid); background:var(--page);
  }
  #filters .fl{font-size:11px; color:var(--muted); letter-spacing:.09em; text-transform:uppercase; font-weight:600; margin-right:4px;}
  .chip{
    appearance:none; cursor:pointer; border:1px solid var(--grid); background:var(--surface);
    color:var(--ink2); font:600 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:6px 11px; border-radius:999px; display:inline-flex; align-items:center; gap:6px;
  }
  .chip .dot{width:8px; height:8px; border-radius:50%; background:var(--dotc,var(--muted));}
  .chip:hover{border-color:var(--baseline);}
  .chip.on{border-color:var(--dotc,var(--accent)); color:var(--ink); background:var(--accent-soft);}
  .chip.on.all{border-color:var(--accent);}

  /* ---------- deck ---------- */
  #deck{
    flex:1 1 auto; display:flex; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; scroll-behavior:smooth;
  }
  @media (prefers-reduced-motion: reduce){ #deck{scroll-behavior:auto;} }
  .slide{
    flex:0 0 100%; width:100%; scroll-snap-align:start; overflow-y:auto; overflow-x:hidden;
    padding:34px clamp(18px,4vw,64px) 60px;
  }
  .slide .inner{max-width:1080px; margin:0 auto;}
  h1{font-size:clamp(34px,5.2vw,58px); line-height:1.05; letter-spacing:-.02em; font-weight:800; text-wrap:balance;}
  h2{font-size:clamp(22px,3vw,30px); letter-spacing:-.01em; font-weight:750; text-wrap:balance;}
  h3{font-size:16px; font-weight:700;}
  .sub{color:var(--ink2); max-width:68ch;}

  /* cover */
  #cover .inner{display:flex; flex-direction:column; gap:26px; padding-top:5vh;}
  .monthstrip{display:flex; gap:0; align-items:baseline; flex-wrap:wrap; color:var(--muted); font-weight:800;
    font-size:clamp(20px,3.4vw,34px); letter-spacing:.02em;}
  .monthstrip b{color:var(--ink);}
  .monthstrip span.arrow{color:var(--baseline); margin:0 .35em; font-weight:400;}
  .coverstats{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-top:8px;}
  .tile{background:var(--surface); border:1px solid var(--ring); border-radius:12px; padding:14px 16px;}
  .tile .lb{font-size:12px; color:var(--muted); margin-bottom:4px;}
  .tile .v{font-size:30px; font-weight:700; letter-spacing:-.01em;}
  .tile .d{font-size:12px; color:var(--ink2); margin-top:3px;}
  .tile .d .up{color:var(--good); font-weight:600;}
  .tile .d .dn{color:var(--bad); font-weight:600;}
  .src{font-size:11.5px; color:var(--muted);}
  .src a{color:inherit;}

  /* arcs slide */
  .arcs{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:20px;}
  .arc{background:var(--surface); border:1px solid var(--ring); border-radius:12px; padding:16px 18px; border-top:3px solid var(--ac,var(--accent));}
  .arc h3{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .arc h3 .n{color:var(--muted); font-weight:600; font-size:13px;}
  .arc p{font-size:13.5px; color:var(--ink2);}
  .arc p b{color:var(--ink);}

  /* charts */
  .chartcard{background:var(--surface); border:1px solid var(--ring); border-radius:12px; padding:18px 18px 10px; margin-top:18px;}
  .chartcard .chd{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .chartcard h3{font-size:15px;}
  .chartcard .csub{font-size:12.5px; color:var(--ink2);}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin:8px 0 2px; font-size:12px; color:var(--ink2);}
  .legend .k{display:inline-flex; align-items:center; gap:6px;}
  .legend .sw{width:14px; height:3px; border-radius:2px; background:var(--kc);}
  .legend .swd{width:9px; height:9px; border-radius:50%; background:var(--kc);}
  svg.chart{width:100%; height:auto; display:block;}
  svg.chart text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  .tick{fill:var(--muted); font-size:11px; font-variant-numeric:tabular-nums;}
  .gl{stroke:var(--grid); stroke-width:1;}
  .bl{stroke:var(--baseline); stroke-width:1;}
  .dl{fill:var(--ink2); font-size:11.5px; font-weight:600;}
  .anno{fill:var(--muted); font-size:10.5px;}
  .annoband{fill:var(--accent); opacity:.055;}
  .tabwrap{margin:8px 0 6px;}
  .tabwrap summary{cursor:pointer; font-size:12px; color:var(--muted); padding:4px 0;}
  .tabwrap table{border-collapse:collapse; font-size:12px; margin-top:6px; width:100%;}
  .tabwrap th,.tabwrap td{border-bottom:1px solid var(--grid); padding:4px 8px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink2);}
  .tabwrap th:first-child,.tabwrap td:first-child{text-align:left;}
  .tabwrap th{color:var(--muted); font-weight:600;}
  #tip{
    position:fixed; pointer-events:none; z-index:50; display:none;
    background:var(--surface); border:1px solid var(--ring); border-radius:8px;
    box-shadow:0 4px 18px rgba(0,0,0,.13); padding:8px 10px; font-size:12px; max-width:300px;
  }
  #tip .th{font-weight:700; margin-bottom:3px;}
  #tip .tr{display:flex; justify-content:space-between; gap:12px; color:var(--ink2);}
  #tip .tr b{font-variant-numeric:tabular-nums; color:var(--ink);}
  #tip .ts{color:var(--muted); margin-top:4px; font-size:11px; max-width:36ch;}

  /* month slides */
  .mhead{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  .mhead .big{font-size:clamp(40px,6vw,64px); font-weight:800; letter-spacing:-.02em; line-height:1;}
  .mhead .cnt{color:var(--muted); font-size:13px;}
  .mlede{color:var(--ink2); max-width:78ch; margin-bottom:18px; font-size:14.5px;}
  .ev{
    display:grid; grid-template-columns:64px 1fr; gap:0 14px; padding:11px 4px 11px 0;
    border-top:1px solid var(--grid);
  }
  .ev:last-child{border-bottom:1px solid var(--grid);}
  .ev .dt{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; padding-top:2px; white-space:nowrap;}
  .ev .tt{font-weight:650; font-size:14px;}
  .ev .tt .tag{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;
    letter-spacing:.05em; color:var(--ink2); border:1px solid var(--grid); border-radius:999px;
    padding:2px 8px; margin-left:8px; vertical-align:2px; text-transform:uppercase;
  }
  .ev .tt .tag i{width:7px; height:7px; border-radius:50%; background:var(--tc); display:inline-block;}
  .ev .bd{color:var(--ink2); font-size:13.5px; margin-top:2px; max-width:88ch;}
  .ev .bd b{color:var(--ink);}
  .ev .sc{margin-top:3px;}
  .ev.hid{display:none;}

  /* megaweek grid */
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:10px; margin-top:16px;}
  .pcard{background:var(--surface); border:1px solid var(--ring); border-radius:11px; padding:12px 14px;}
  .pcard .ph{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .pcard .tk{font-weight:800; font-size:14px;}
  .pcard .when{color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums;}
  .verd{margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    border-radius:999px; padding:2px 9px; display:inline-flex; align-items:center; gap:5px;}
  .verd::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor;}
  .verd.bull{color:var(--good); background:color-mix(in srgb, var(--good) 10%, transparent);}
  .verd.bear{color:var(--bad); background:color-mix(in srgb, var(--bad) 10%, transparent);}
  .verd.neut{color:var(--muted); background:color-mix(in srgb, var(--muted) 12%, transparent);}
  .pcard p{font-size:13px; color:var(--ink2);}
  .pcard p b{color:var(--ink);}

  /* quotes */
  .pull{
    border-left:3px solid var(--accent); padding:6px 0 6px 16px; margin:18px 0;
    font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:17px; color:var(--ink);
    max-width:70ch;
  }
  .pull .who{display:block; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-style:normal; font-size:12px; color:var(--muted); margin-top:5px;}

  /* next slide */
  .nextlist{margin-top:14px; display:grid; gap:0;}
  footer.note{margin-top:26px; padding-top:12px; border-top:1px solid var(--grid); color:var(--muted); font-size:11.5px; max-width:90ch;}
  kbd{border:1px solid var(--grid); border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:11px; background:var(--surface); color:var(--ink2);}
</style>

<div id="shell">
  <header id="bar">
    <div class="ttl">AI — the last six months <span>· Feb–Jul 2026</span></div>
    <div id="scrub" role="tablist" aria-label="Slides"></div>
    <button class="navbtn" id="prevB" aria-label="Previous slide">←</button>
    <button class="navbtn" id="nextB" aria-label="Next slide">→</button>
    <button class="navbtn" id="themeBtn" aria-label="Toggle dark mode">◐</button>
  </header>
  <div id="filters" hidden>
    <span class="fl">Filter</span>
  </div>
  <div id="deck"></div>
</div>
<div id="tip" role="status"></div>

<script>
/* ================= DATA ================= */

const THEMES = {
  LABS:    {name:'Labs & ARR',      css:'--c-labs'},
  CAPEX:   {name:'Hyperscalers & capex', css:'--c-capex'},
  CHIPS:   {name:'Chips & systems', css:'--c-chips'},
  MEM:     {name:'Memory',          css:'--c-mem'},
  SEMICAP: {name:'Semicap & foundry', css:'--c-semicap'},
  POWER:   {name:'Power & DC',      css:'--c-power'},
  MACRO:   {name:'Tape & positioning', css:'--c-macro'},
};

/* Every card: d date, th theme, t title, b body (HTML ok), s source line */
const EVENTS = [
/* ---------- FEBRUARY ---------- */
{d:`2026-02-04`, th:`CAPEX`, t:`GOOG Q4'25 — the baseline that will look quaint`, b:`Search +17%, Cloud +48% (margin 30.1%), backlog $240B (+55% q/q); <b>FY26 capex guided $175–185B</b>; Gemini 750M MAU. This guide gets raised twice by July.`, s:`GOOG Q4'25 call, 2026-02-04`},
{d:`2026-02-05`, th:`CAPEX`, t:`AMZN Q4'25 — AWS re-accelerates, ~$200B capex set`, b:`AWS +24% ($142B run-rate, fastest in 13 quarters); custom silicon >$10B run-rate, Trainium3 shipping; backlog $244B; <b>FY26 capex ~$200B</b>.`, s:`AMZN Q4'25 call, 2026-02-05`},
{d:`2026-02-05`, th:`LABS`, t:`Codex crosses 1M weekly users`, b:`OpenAI's coding agent hits 1M WAU — it reaches <b>5M by end-May</b>, ~5x in four months. Coding becomes the demand engine of the whole lab complex.`, s:`FundaAI "LLM 26H1 Update Pt 2", 2026-06-24`},
{d:`2026-02-06`, th:`MEM`, t:`"Memory Mania" — the first full build of the cycle`, b:`HBM wafer capacity 331k (end-25) → 473k (end-26E) → 668k wspm (end-27E); DRAM deficit ~7% in '26/'27; 1Q26 contract DDR5 <b>+70% q/q</b> (+638% y/y). HBM4 share forecast: Hynix ~60% / Samsung ~30% / Micron ~0%.`, s:`SemiAnalysis "Memory Mania", 2026-02-06`},
{d:`2026-02-09`, th:`CHIPS`, t:`"CPUs are Back" — the server-CPU leg joins the shortage`, b:`ARM designing a custom CPU for OpenAI inside Stargate; AWS Graviton5 disclosed (192 Neoverse V3 cores, N3). OpenAI named one of the few buyers able to secure DRAM/CPU allocation in the 2026 shortage.`, s:`SemiAnalysis (Wong & Patel), 2026-02-09`},
{d:`2026-02-12`, dd:`Feb`, th:`LABS`, t:`Anthropic Series G closes: $380B post`, b:`$30B raised. Three months later the Series H prices at $965B — the fastest large-cap valuation double on record in the wiki.`, s:`Company / FundaAI, 2026-06-24`},
{d:`2026-02-15`, dd:`Feb`, th:`LABS`, t:`OpenAI mega-round opens at $730B pre`, b:`Raise opens at $110B, later expanded to <b>$122B</b> — closes late March at $852B post. Backers include Microsoft (~26.8%), Amazon (~$50B), NVIDIA (~$30B), SoftBank.`, s:`Tech Insider / wiki private snapshot; Barron's, 2026-05-25`},
{d:`2026-02-18`, dd:`Feb`, th:`LABS`, t:`Anthropic's "$5–6 billion-dollar month"`, b:`February ARR ~$14B (net-add +$5B m/m on the FundaAI path; SemiAnalysis's alternative path 9→12→19 carries the +$7B Feb). Jensen Huang calls it an AI <em class="q">"Oppenheimer moment"</em>. OpenAI–AWS also sign a ~2 GW Trainium deal (~$100B+, deliveries from 2027).`, s:`FundaAI 06-24; Jensen remarks 2026-04-16; JPM "AI Capex 2.0", 2026-06-16`},
{d:`2026-02-25`, th:`CHIPS`, t:`NVDA Q4 FY26 — a $194B data-center year`, b:`Rev $68B (+73%); FY26 DC revenue $194B (+68%), FY26 FCF $97B; <b>~9 GW of Blackwell deployed</b>. SBC moves into non-GAAP from Q1 FY27.`, s:`NVDA Q4 FY26 print, 2026-02-25`},
{d:`2026-02-26`, th:`POWER`, t:`First utility-side mark on 2026 capex`, b:`Vistra's Q4 call pegs hyperscaler capex <b>>$700B in 2026, ~+50% y/y</b> — the demand signal reaching the power sector.`, s:`VST Q4 FY25 call, 2026-02-26`},

/* ---------- MARCH ---------- */
{d:`2026-03-03`, th:`MEM`, t:`The demand-destruction case, fully specified`, b:`Bernstein prices the consumer pass-through: iPhone 18 Pro Max 12GB DRAM line <b>$29 → $114 (+294%)</b>, memory 5% → ~17% of BOM; 256GB NAND +169%; device cost +23–26%. The bear case that resurfaces via QCOM/ARM guides in late July.`, s:`Bernstein · Mark Newman, 2026-03-03`},
{d:`2026-03-04`, th:`CHIPS`, t:`AVGO adds OpenAI as its 6th XPU customer`, b:`Q1 FY26: AI semis $8.4B (+106% y/y); AI networking +60%, now 40% of AI revenue; first <b>"line of sight >$100B AI chips FY27"</b>.`, s:`AVGO Q1 FY26 call, 2026-03-04`},
{d:`2026-03-04`, th:`LABS`, t:`OpenAI ARR hits $25B`, b:`Up from ~$20B exit-2025. Barclays' framework the following week lays out OpenAI's own plan: $30B '26 → $62B '27 → $284B 2030 — implying $111B more cash burn through 2030.`, s:`The Information 3/4/26 via Barclays Framework, Mar-2026`},
{d:`2026-03-11`, th:`MACRO`, t:`The only hard capex-PEAK call on file`, b:`Barclays models AI capex peaking <b>~2028 at ~$1T</b> (≈90% of hyperscaler OCF, ~$300B above then-consensus '28). By June the same desk pushes the peak past 2028 — the S-curve steepened under its own call.`, s:`Barclays · Ross Sandler, 2026-03-11`},
{d:`2026-03-11`, th:`LABS`, t:`Anthropic: $1B → $9B → $19B, already past its own plan`, b:`Barclays: Anthropic had guided ~$18B of 2026 revenue as of January — passed by early March (~$19B run-rate, ~70% direct API). Modeled compute expense: $8B '25 → $22B '26E → $46B '27E.`, s:`Barclays AI framework, 2026-03-11`},
{d:`2026-03-15`, th:`LABS`, t:`Claude Code alone is a $2.5B+ ARR product`, b:`Mizuho's frontier deep-dive: OpenAI ~920M WAU (sell-side basis), 7 customers on $100M+ deals; Anthropic ≥9 customers >$100M/yr, ~500 at $1M+ (vs 12 two years prior). Frontier labs taking a rising share of IT budgets.`, s:`Mizuho · Marc Bachner "On the Frontier", 2026-03-15`},
{d:`2026-03-18`, th:`MEM`, t:`Micron F2Q26 — the first vertical-margin quarter`, b:`Rev $23.9B (+196% y/y, +75% q/q); DRAM ASP +mid-60s% q/q, NAND +high-70s%; GM 75% (+18pts q/q), guided ~81%; FCF $6.9B. Micron can fill only <b>50–66% of key-customer demand</b>.`, s:`MU F2Q26 call, 2026-03-18`},
{d:`2026-03-20`, dd:`Mar`, th:`CHIPS`, t:`GTC 2026 — the AI factory becomes a product`, b:`Vera Rubin DSX formalized as the full AI-factory reference design (compute/network/storage + power/cooling/civil); Foxconn modular-DC concept with Schneider unveiled.`, s:`SemiAnalysis "LEGO Datacenters", 2026-07-29 (retro)`},
{d:`2026-03-26`, th:`POWER`, t:`The low bookend on $/GW`, b:`Bernstein's AI-DC value-chain build: <b>~$36B/GW</b> (~$6M/rack × ~5,929 racks/GW) vs the $50–60B/GW consensus — the spread that defines every capex-per-GW debate after it.`, s:`Bernstein "AI DC value chain", 2026-03-26`},
{d:`2026-03-28`, dd:`Mar`, th:`LABS`, t:`OpenAI closes at $852B post-money`, b:`$122B raised (expanded from $110B). PitchBook later marks $880B. From the $300B SoftBank round (Mar-25) to $852B in twelve months.`, s:`Tech Insider; Barron's, 2026-05-25`},
{d:`2026-03-29`, th:`POWER`, t:`The transformer super-cycle, sized`, b:`~4,300 large power transformers needed 2025–30 — <b>2–3x domestic production</b> (200–300 built in 2024); ~74 GW of incremental US DC demand 2025-28E → a 9–18 GW power-access shortfall.`, s:`Morgan Stanley Global Industrials, 2026-03-29`},
{d:`2026-03-30`, dd:`Mar`, th:`CAPEX`, t:`Google caps Meta's Gemini access`, b:`Meta sought additional Gemini capacity; Google said it could not deliver — its own constraints bind. The anecdote that foreshadows "Meta Compute" three months later.`, s:`FT via Rothschild & Co, 2026-06-29`},

/* ---------- APRIL ---------- */

        <span class="k"><span class="swd" style="--kc:var(--c-labs)"></span>Anthropic</span>
        <span class="k"><span class="swd" style="--kc:var(--c-capex)"></span>OpenAI</span>
      </div>
      <div id="arrChart"></div>
      <details class="tabwrap"><summary>Table view</summary><div id="arrTable"></div></details>
      <div class="src">Marks as logged in the wiki: JPM (06-16) · Mizuho (03-15) · BofA (07-06) · company Series H (05-28) · FundaAI (06-24) · SemiAnalysis / MS Wigg (07-08) · Yipit (07-10) · The Information (03-04) · CNBC/The Information (07-30). Run-rate estimates, not audited revenue.</div>
    </div>
    <div class="chartcard" id="cpxCard">
      <div class="chd"><h3>Street rewrote 2027 capex three times — once per earnings season</h3><span class="csub">BEst consensus capex, CY2027E, USD bn — weekly</span></div>
      <div class="legend">
        <span class="k"><span class="sw" style="--kc:var(--c-labs)"></span>MSFT</span>
        <span class="k"><span class="sw" style="--kc:var(--c-capex)"></span>GOOG</span>
        <span class="k"><span class="sw" style="--kc:var(--c-chips)"></span>META</span>
        <span class="k"><span class="sw" style="--kc:var(--c-mem)"></span>AMZN</span>
      </div>
      <div id="cpxChart"></div>
      <details class="tabwrap"><summary>Table view (month-ends)</summary><div id="cpxTable"></div></details>
      <div class="src">Bloomberg BEst via Capstone wrapper, asof 2026-07-31 (MSFT calendarized from fiscal quarters; see _data/hyperscaler_revisions_2027_2028.json). Four-name sum: 2027E $540B→$955B (+77% YTD); 2028E $540B→$1,060B (+96%).</div>
    </div>
  </div>`});

  /* month slides */
  for(const mk of ['02','03','04','05','06','07']){
    const evs = EVENTS.filter(e=>e.d.slice(5,7)===mk).sort((a,b)=>a.d<b.d?-1:1);
    const info = MONTH_INFO[mk];
    slides.push({id:'m'+mk, lab:info.key, month:true, html:`
    <div class="inner">
      <div class="mhead"><div class="big">${info.key} <span style="color:var(--muted);font-size:.45em;font-weight:600">2026</span></div><div class="cnt">${evs.length} logged events</div></div>
      <p class="mlede">${info.lede}</p>
      <div class="evlist">${evs.map(evCard).join('')}</div>
    </div>`});
  }

  /* megaweek */
  slides.push({id:'week', lab:'THE MEGAWEEK', html:`
  <div class="inner">
    <div class="eyebrow">Jul 16 – Jul 30 · earnings vs the bogeys</div>
    <h2>Positioning meets the prints</h2>
    <p class="sub">The clean read of the season: the discriminator was <b>visible accelerating cloud revenue alongside the spend</b> — AMZN raised capex and rallied, MSFT held and rallied, META narrowed and fell. And in semis, a beat-and-raise was no longer enough.</p>
    <div class="grid2">${WEEK.map(w=>`
      <div class="pcard">
        <div class="ph"><span class="tk">${w.tk}</span><span class="when">${w.d}</span><span class="verd ${w.v==='bull'?'bull':w.v==='bear'?'bear':'neut'}">${w.v==='bull'?'bull won':w.v==='bear'?'bear won':'neutral'}</span></div>
        <p>${w.t}</p>
        <div class="src" style="margin-top:5px">${w.s}</div>
      </div>`).join('')}
    </div>
    <footer class="note">Also that week: TER record quarter with a Sept guide ~21%/37% above Street (bull); CDNS beat-and-raise into “the worst EDA sentiment” JPM had seen (bull); GLW beat on every line and fell >15% on a reiterated-not-raised Springboard (bear); NXPI met numbers and fell 5.7% after TXN had re-rated the group (bear); SK hynix priced the largest-ever first-time foreign US listing on 07-10 ($26.5B, 7x oversubscribed). Sources: respective prints + desk recaps, 2026-07-27/30; outcomes ledger.</footer>
  </div>`});

  /* next */
  slides.push({id:'next', lab:'WHAT’S NEXT', html:`
  <div class="inner">
    <div class="eyebrow">Aug 2026 onward</div>
    <h2>What resolves the open debates</h2>
    <div class="nextlist">${NEXT.map(n=>`
      <div class="ev" data-th="X"><div class="dt">${n.d.replace('2026-','')}</div>
      <div><div class="tt">${n.t}</div><div class="bd">${n.b}</div><div class="src sc">${n.s}</div></div></div>`).join('')}
    </div>
    <div class="pull">“Buyside numbers are already there — and higher. Earnings season could be tough for all of semicap given how high buyside numbers already are for the next few years.”<span class="who">Barclays, on the KLAC reaction — 2026-07-28</span></div>
    <footer class="note">Built from the Capstone research wiki (sell-side notes, expert calls, transcripts, primary filings), 2026-07-31. Attribution rule applies throughout: broker/analyst + date on every datapoint; ARR figures are run-rate estimates unless stated by the company; capex consensus is Bloomberg BEst. Not investment advice.</footer>
  </div>`});

  return slides;
}

/* ---------- deck mechanics ---------- */
let SLIDES=[], cur=0;
function mount(){
  SLIDES=buildSlides();
  deck.innerHTML=SLIDES.map(s=>`<section class="slide" id="s-${s.id}" role="tabpanel">${s.html}</section>`).join('');
  scrub.innerHTML=SLIDES.map((s,i)=>`<button role="tab" data-i="${i}">${s.lab}</button>`).join('');
  scrub.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) go(+b.dataset.i);});
  buildFilters(); drawARR(); drawCapex(); sync(0);
  deck.addEventListener('scroll',()=>{clearTimeout(deck._t); deck._t=setTimeout(()=>{const i=Math.round(deck.scrollLeft/deck.clientWidth); if(i!==cur) sync(i);},80);});
}
function go(i){ cur=Math.max(0,Math.min(SLIDES.length-1,i)); deck.scrollTo({left:cur*deck.clientWidth,behavior:'smooth'}); sync(cur); }
function sync(i){ cur=i; $$('#scrub button').forEach((b,j)=>b.classList.toggle('on',j===i));
  $('#filters').hidden = !(SLIDES[i]&&SLIDES[i].month);
  const on=$$('#scrub button')[i]; if(on) on.scrollIntoView({block:'nearest',inline:'nearest'});
}
$('#prevB').onclick=()=>go(cur-1); $('#nextB').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown') go(cur+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp') go(cur-1);
});
addEventListener('resize',()=>{deck.scrollTo({left:cur*deck.clientWidth});});

/* theme toggle */
$('#themeBtn').onclick=()=>{
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark?'light':'dark';
  drawARR(); drawCapex();
};

/* filters */
let FILTER='ALL';
function buildFilters(){
  const f=$('#filters');
  f.insertAdjacentHTML('beforeend',
    `<button class="chip all on" data-th="ALL">All</button>`+
    Object.entries(THEMES).map(([k,t])=>`<button class="chip" data-th="${k}" style="--dotc:var(${t.css})"><span class="dot"></span>${t.name}</button>`).join(''));
  f.addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    FILTER=c.dataset.th;
    $$('#filters .chip').forEach(x=>x.classList.toggle('on',x===c));
    $$('.ev[data-th]').forEach(ev=>{ if(ev.dataset.th==='X') return;
      ev.classList.toggle('hid', FILTER!=='ALL'&&ev.dataset.th!==FILTER);});
  });
}

/* ---------- charts ---------- */
const tip=$('#tip');
function showTip(html,x,y){ tip.innerHTML=html; tip.style.display='block';
  const r=tip.getBoundingClientRect();
  tip.style.left=Math.min(innerWidth-r.width-10,x+14)+'px';
  tip.style.top=Math.min(innerHeight-r.height-10,y+14)+'px'; }
function hideTip(){ tip.style.display='none'; }
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const dayN=d=>Math.round((new Date(d+'T00:00:00Z')-new Date('2025-12-01T00:00:00Z'))/864e5);
const fmt=v=>v>=100?Math.round(v).toLocaleString('en-US'):(Math.round(v*10)/10).toLocaleString('en-US');

function drawARR(){
  const host=$('#arrChart'); if(!host) return;
  const W=980,H=380,L=46,R=120,T=18,B=34;
  const x0=dayN('2025-12-15'), x1=dayN('2026-08-05');
  const X=d=>L+(dayN(d)-x0)/(x1-x0)*(W-L-R);
  const ymax=75, Y=v=>T+(1-v/ymax)*(H-T-B);
  const cA=cssv('--c-labs'), cO=cssv('--c-capex'), surf=cssv('--surface');
  let s='';
  for(const g of [0,25,50,75]) s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}"/><text class="tick" x="${L-8}" y="${Y(g)+4}" text-anchor="end">${g}</text>`;
  s+=`<line class="bl" x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  const months=['2026-01-01','2026-02-01','2026-03-01','2026-04-01','2026-05-01','2026-06-01','2026-07-01','2026-08-01'];
  const mlab=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];
  months.forEach((m,i)=>{ s+=`<text class="tick" x="${X(m)}" y="${H-B+18}" text-anchor="middle">${mlab[i]}</text>`; });
  /* crossover annotation */
  s+=`<rect class="annoband" x="${X('2026-04-01')}" y="${T}" width="${X('2026-05-15')-X('2026-04-01')}" height="${H-T-B}"/>`;
  s+=`<text class="anno" x="${X('2026-04-22')}" y="${T+12}" text-anchor="middle">Anthropic overtakes OpenAI (Apr, ARR; May, business share)</text>`;
  function line(pts,col){
    const p=pts.filter(p=>p.v!=null);
    return `<path d="${p.map((q,i)=>(i?'L':'M')+X(q.d).toFixed(1)+','+Y(q.v).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
      + p.map(q=>`<circle class="pt" data-tip="${esc(q.s)}" data-v="$${q.v}B — ${q.d}" cx="${X(q.d).toFixed(1)}" cy="${Y(q.v).toFixed(1)}" r="4.5" fill="${col}" stroke="${surf}" stroke-width="2"/>`).join('');
  }
  s+=line(ARR.anthropic,cA)+line(ARR.openai,cO);
  /* July>Q2 annotation for OpenAI */
  s+=`<circle class="pt" data-tip="${esc(ARR.openai[3].s)}" data-v="no figure disclosed" cx="${X('2026-07-29')}" cy="${Y(36)}" r="4.5" fill="${surf}" stroke="${cO}" stroke-width="2" stroke-dasharray="none"/>
      <text class="anno" x="${X('2026-07-29')}" y="${Y(36)-10}" text-anchor="middle">“July &gt; all of Q2”</text>`;
  s+=`<text class="dl" x="${X('2026-07-10')+10}" y="${Y(69)+4}">Anthropic $69B</text>`;
  s+=`<text class="dl" x="${X('2026-05-31')+10}" y="${Y(33)+14}">OpenAI ~$33B</text>`;
  host.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Frontier lab ARR marks, Dec 2025 to Jul 2026">${s}</svg>`;
  hookPts(host);
  $('#arrTable').innerHTML=tbl(['Date','Lab','Run-rate ($bn)','Source'],
    [...ARR.anthropic.map(p=>[p.d,'Anthropic',p.v??'—',p.s]),...ARR.openai.map(p=>[p.d,'OpenAI',p.v??'—',p.s])].sort((a,b)=>a[0]<b[0]?-1:1));
}

function drawCapex(){
  const host=$('#cpxChart'); if(!host) return;
  const rows=CAPEX_HIST['2027'];
  const W=980,H=400,L=52,R=96,T=16,B=34;
  const x0=dayN(rows[0][0]), x1=dayN(rows[rows.length-1][0])+4;
  const X=d=>L+(dayN(d)-x0)/(x1-x0)*(W-L-R);
  const ymax=320, Y=v=>T+(1-v/ymax)*(H-T-B);
  const cols=[cssv('--c-labs'),cssv('--c-capex'),cssv('--c-chips'),cssv('--c-mem')];
  const names=['MSFT','GOOG','META','AMZN'];
  const surf=cssv('--surface');
  let s='';
  for(const g of [0,100,200,300]) s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}"/><text class="tick" x="${L-8}" y="${Y(g)+4}" text-anchor="end">${g}</text>`;
  s+=`<line class="bl" x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  const months=['2026-01-01','2026-02-01','2026-03-01','2026-04-01','2026-05-01','2026-06-01','2026-07-01'];
  const mlab=['Jan','Feb','Mar','Apr','May','Jun','Jul'];
  months.forEach((m,i)=>{ s+=`<text class="tick" x="${X(m)}" y="${H-B+18}" text-anchor="middle">${mlab[i]}</text>`; });
  /* earnings-season bands */
  const bands=[['2026-01-27','2026-02-13','Q4-25 season'],['2026-04-22','2026-05-08','Q1-26 season'],['2026-07-15','2026-07-31','Q2-26 season']];
  for(const [a,b,lab] of bands){ s+=`<rect class="annoband" x="${X(a)}" y="${T}" width="${X(b)-X(a)}" height="${H-T-B}"/><text class="anno" x="${(X(a)+X(b))/2}" y="${T+11}" text-anchor="middle">${lab}</text>`; }
  /* series: idx 2..5 = MSFT GOOG META AMZN */
  names.forEach((nm,k)=>{
    const pts=rows.map(r=>[r[0],r[2+k]]);
    s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${cols[k]}" stroke-width="2" stroke-linejoin="round"/>`;
    const last=pts[pts.length-1];
    s+=`<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4.5" fill="${cols[k]}" stroke="${surf}" stroke-width="2"/>`;
    s+=`<text class="dl" x="${X(last[0])+9}" y="${Y(last[1])+4}">${nm} ${Math.round(last[1])}</text>`;
  });
  /* hover layer: nearest-date crosshair */
  s+=`<line id="cx" y1="${T}" y2="${H-B}" stroke="${cssv('--baseline')}" stroke-width="1" style="display:none"/>`;
  s+=`<rect id="hover" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>`;
  host.innerHTML=`<svg class="chart" id="cpxSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="2027 capex consensus by company, weekly">${s}</svg>`;
  const svg=$('#cpxSvg'), hov=svg.querySelector('#hover'), cx=svg.querySelector('#cx');
  hov.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect(), mx=(e.clientX-r.left)*(W/r.width);
    let bi=0,bd=1e9;
    rows.forEach((row,i)=>{const d=Math.abs(X(row[0])-mx); if(d<bd){bd=d;bi=i;}});
    const row=rows[bi];
    cx.style.display='block'; cx.setAttribute('x1',X(row[0])); cx.setAttribute('x2',X(row[0]));
    showTip(`<div class="th">${row[0]}</div>`+names.map((nm,k)=>`<div class="tr"><span>${nm}</span><b>$${fmt(row[2+k])}B</b></div>`).join('')+`<div class="tr" style="margin-top:3px"><span>Sum</span><b>$${fmt(row[1])}B</b></div>`,e.clientX,e.clientY);
  });
  hov.addEventListener('mouseleave',()=>{cx.style.display='none';hideTip();});
  const me=rows.filter((r,i)=>i===0||r[0].slice(8)>='24'&&(i===rows.length-1||rows[i+1][0].slice(5,7)!==r[0].slice(5,7))||i===rows.length-1);
  $('#cpxTable').innerHTML=tbl(['Week','MSFT','GOOG','META','AMZN','Sum 2027E','Sum 2028E'],
    me.map(r=>{const r8=CAPEX_HIST['2028'].find(q=>q[0]===r[0]);return [r[0],fmt(r[2]),fmt(r[3]),fmt(r[4]),fmt(r[5]),fmt(r[1]),r8?fmt(r8[1]):'—'];}));
}

function tbl(head,rows){
  return `<div style="overflow-x:auto"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function hookPts(host){
  host.querySelectorAll('.pt').forEach(c=>{
    c.style.cursor='pointer';
    c.addEventListener('mousemove',e=>showTip(`<div class="th">${c.dataset.v}</div><div class="ts">${c.dataset.tip}</div>`,e.clientX,e.clientY));
    c.addEventListener('mouseleave',hideTip);
  });
}

mount();
</script>
