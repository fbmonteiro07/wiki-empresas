<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Update — Recap 1S26 | Capstone (slides)</title>
</head>
<body data-theme="ppt">
<style>
  :root{
    /* PPT theme: white body, petrol title band, print-safe categorical palette */
    --band:#002231; --paper:#ffffff; --panel:#ffffff; --panel2:#fbfcfd; --bg:#e8eaec;
    --txt:#16181a; --ink:#16181a; --ink2:#3f4750; --mut:#6b7480;
    --line:#e3e6ea; --grid:#e3e6ea; --baseline:#c6ccd3;
    --blue:#0F6290; --gold:#C77A0F; --green:#1F9D6B; --purple:#6B5CA5;
    --pink:#B5306B; --red:#C0392B; --gray:#5B6573; --rest:#9AA7B5;
    --acc:#0F6290; --up:#1e7d3c; --dn:#c0392b; --good:#1e7d3c; --bad:#c0392b; --warnc:#b45309;
    --hard:#0e7a3d; --partial:#2a5fb0; --est:#9a6a00;
    --pet:#0F6290; --org:#C77A0F; --pur:#6B5CA5; --steel:#5B6573; --surface:#ffffff;
    /* OpenRouter buckets (print-safe) */
    --or-ds:#B5306B; --or-xi:#6B5CA5; --or-tc:#1B7F94; --or-za:#8a7318; --or-ms:#5f6b21;
    --or-gg:#0F6290; --or-oa:#1F9D6B; --or-an:#C77A0F; --or-oth:#9AA7B5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  html{scroll-snap-type:y mandatory; scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }
  body{background:var(--bg); color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif; font-size:14.5px;}
  /* page chrome hidden — the deck IS the page */
  header.top{display:none;}
  nav.tabs{position:fixed; top:0; left:0; right:0; z-index:30; display:flex; gap:6px; flex-wrap:nowrap;
    padding:7px 12px; background:rgba(0,34,49,.94); backdrop-filter:blur(6px);
    overflow-x:auto; overflow-y:hidden; scrollbar-width:thin;}
  nav.tabs a{color:#9fb3bd; text-decoration:none; border:1px solid #14384a; background:#062535;
    border-radius:14px; padding:3px 10px; font-size:10.5px; white-space:nowrap; cursor:pointer; font-weight:600;}
  nav.tabs a:hover{color:#fff; border-color:#3f7f9c;}
  nav.tabs a.on{background:var(--gold); border-color:var(--gold); color:#fff;}
  footer.pagefoot{display:none;}
  /* slides */
  .slidewrap{height:100vh; scroll-snap-align:center; display:flex; align-items:center; justify-content:center; padding-top:40px;}
  .panel, #hero{width:1280px; height:720px; flex:0 0 auto; background:var(--paper);
    border:0; border-radius:0; margin:0; padding:0; overflow:hidden;
    display:flex; flex-direction:column; position:relative;
    box-shadow:0 8px 40px rgba(0,20,30,.20); transform:scale(var(--sc,1)); transform-origin:center center;}
  .panel>h2{flex:0 0 86px; background:var(--band); color:#fff; margin:0; padding:0 40px;
    display:flex; align-items:center; gap:14px; font-size:29px; font-weight:700;
    text-transform:none; letter-spacing:-.01em; line-height:1.08;}
  .panel>h2 .sub{color:#9fb3bd; font-weight:400; font-size:16px; letter-spacing:0; text-transform:none;}
  .panel>h2 .verd{margin-left:auto; font-size:12px; padding:5px 12px; border-radius:12px; font-weight:700; white-space:nowrap;}
  .verd.up{background:var(--up); color:#fff;} .verd.watch{background:var(--warnc); color:#fff;} .verd.flat{background:#38505e; color:#dfe7ec;}
  .panel>h2 img.slidelogo{height:60px; margin-left:auto; flex:0 0 auto;}
  .panel>h2 .verd + img.slidelogo{margin-left:14px;}
  .pbody{flex:1 1 auto; padding:22px 40px 8px; overflow:hidden; min-height:0;}
  .note{flex:0 0 auto; color:var(--mut); font-size:10.5px; line-height:1.4; padding:8px 40px 14px;
    border-top:1px solid var(--line); margin:0 0 0; max-width:none;}
  .pageno{position:absolute; bottom:11px; right:18px; font-size:10.5px; color:var(--mut); font-variant-numeric:tabular-nums;}
  /* cover */
  #hero{background:var(--band); color:#fff; padding:56px 64px; display:flex; flex-direction:column;}
  #hero .hero{background:none; border:0; padding:0; margin:0;}
  #hero .hero .q{font-size:56px; font-weight:800; letter-spacing:-.02em; line-height:1.03; color:#fff; max-width:20ch;}
  #hero .hero .a{font-size:19px; color:#a9bcc6; margin-top:16px; max-width:80ch; line-height:1.5;}
  #hero .hero .a b{color:#fff;}
  #hero .kpis{margin-top:auto; gap:16px;}
  #hero .kpi{background:none; border:0; border-top:2px solid rgba(255,255,255,.28); border-radius:0; padding:12px 0 0; min-width:0;}
  #hero .kpi .l{color:#9fb3bd; font-size:11px;}
  #hero .kpi .v{color:#fff; font-size:27px;}
  #hero .kpi .v em{color:var(--gold);}
  #hero .kpi .s{color:#8ba3b0; font-size:10.5px;}
  #hero .kpi .s .up{color:#5fd48b;} #hero .kpi .s .dn{color:#ff8f9a;}
  #hero img.coverlogo{position:absolute; top:44px; right:56px; height:92px;}
  #hero .coverfoot{position:absolute; bottom:26px; left:64px; right:64px; color:#7d939f; font-size:11px;}
  /* content bits — light restyle of the dashboard components */
  .lede{font-size:15.5px; color:var(--ink2); margin-bottom:12px; max-width:none; line-height:1.5;}
  .lede b{color:var(--ink);}
  .kpis{display:flex; gap:14px; flex-wrap:wrap;}
  .kpi{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:11px 16px; min-width:150px; flex:1;}
  .kpi .v{font-size:22px; font-weight:700; color:var(--band); margin-top:2px;}
  .kpi .l{color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.6px;}
  .kpi .s{color:var(--ink2); font-size:11px; margin-top:2px;}
  .rcard{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:11px 13px;}
  .rcard .rt{font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:8px; padding-left:9px;
    border-left:3px solid currentColor; line-height:1.3;}
  .rcard .rt span{display:block; font-size:10.5px; font-weight:400; color:var(--mut);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:18px;}
  .chtitle{font-size:14px; font-weight:700; color:var(--ink); text-align:center; margin-bottom:4px;
    padding-left:0; border-left:0;}
  .rsecx{color:var(--band); font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin:7px 0 4px;
    font-weight:700; padding-left:9px; border-left:3px solid var(--gold); line-height:1.2;}
  .rsecx:first-child{margin-top:0;}
  /* o quadro das clouds (9 mini-charts) precisa caber em 720px */
  .rsecx + .grid3{gap:12px;}
  .rsecx ~ .grid3 .rcard{padding:5px 8px 2px;}
  .rsecx ~ .grid3 .rcard .rt{font-size:11px; margin-bottom:2px; padding-left:7px;}
  .colh{font-size:15px; font-weight:700; color:#fff; background:var(--band); text-transform:none;
    letter-spacing:0; padding:9px 14px; border-radius:3px; margin-bottom:12px;}
  .trow{display:grid; gap:13px;}
  .stile{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px 15px;}
  .stile .l{font-size:11px; color:var(--mut); font-weight:600; text-transform:uppercase; letter-spacing:.5px;}
  .stile .v{font-size:26px; font-weight:750; color:var(--band); margin-top:1px;}
  .stile .d{font-size:11.5px; color:var(--ink2); margin-top:2px; line-height:1.4;}
  .bigrow{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
  .bignum{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:20px 24px;}
  .bignum .k{font-size:14.5px; color:var(--ink2); font-weight:600;}
  .bignum .k b{color:var(--ink);}
  .bignum .v{font-size:52px; font-weight:800; letter-spacing:-.02em; color:var(--band); margin:2px 0;}
  .bignum .v span{font-size:18px; color:var(--mut);}
  .bignum .conta{font-size:13px; color:var(--blue); font-weight:700;}
  .bignum .n{font-size:12.5px; color:var(--mut); margin-top:8px; line-height:1.4;}
  .q{font-size:18px; line-height:1.5; color:var(--ink2); background:none; border:0;
    border-left:3px solid var(--blue); border-radius:0; padding:6px 0 6px 18px;}
  .q b{color:var(--ink);}
  .q .who{display:block; font-size:12px; color:var(--mut); margin-top:5px; font-weight:600;}
  .q.warn{border-left-color:var(--warnc);}
  .qlist{display:flex; flex-direction:column; gap:18px; justify-content:center; height:100%;}
  .legend{display:flex; gap:18px; font-size:13px; color:var(--ink2); margin:2px 0 8px; flex-wrap:wrap;}
  .legend .k{display:inline-flex; align-items:center; gap:7px; font-weight:600;}
  .legend .sw{width:16px; height:3.5px; border-radius:2px; background:var(--kc);}
  .legend .swd{width:10px; height:10px; border-radius:50%; background:var(--kc);}
  svg.chart text{font-family:"Segoe UI",system-ui,sans-serif;}
  .tick{fill:var(--mut); font-size:11.5px; font-variant-numeric:tabular-nums;}
  .gl{stroke:var(--grid); stroke-width:1;}
  .bl{stroke:var(--baseline); stroke-width:1;}
  .dl{fill:var(--ink2); font-size:13px; font-weight:650;}
  .anno{fill:var(--mut); font-size:11px;}
  .steps2{display:flex; flex-direction:column; gap:11px;}
  .step2{display:grid; grid-template-columns:110px 220px 1fr; gap:14px; align-items:center;}
  .step2 .sd{font-size:12px; color:var(--mut); font-weight:650;}
  .step2 .sv{background:var(--band); border:0; color:#fff; font-size:17px; font-weight:750; padding:9px 14px; text-align:center; border-radius:3px;}
  .step2 .sn{font-size:12.5px; color:var(--ink2); line-height:1.42;}
  .stepB{margin-bottom:13px;}
  .stepB .hd{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
  .stepB .sd{font-size:12px; color:var(--mut); font-weight:650; min-width:78px;}
  .stepB .sv{background:var(--band); border:0; color:#fff; font-size:17px; font-weight:750; padding:7px 15px; border-radius:3px;}
  .stepB .sn{font-size:12.5px; color:var(--ink2); line-height:1.42;}
  .stepB .sn b{color:var(--ink);}
  .tablewrap{overflow:hidden;}
  table{border-collapse:collapse; width:100%;}
  th,td{padding:6px 11px; text-align:right; font-variant-numeric:tabular-nums;}
  th{color:#fff; background:var(--band); font-size:12px; text-transform:none; letter-spacing:.3px; border-bottom:0; font-weight:650;}
  td:first-child,th:first-child{text-align:left;}
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:hover{background:rgba(15,98,144,.05);}
  .mst{font-size:13px; white-space:nowrap;}
  .mst td{color:var(--ink2); border:1px solid var(--line);}
  .mst th{border:1px solid var(--band);}
  .mst tr.k-in td.rl{color:var(--blue); font-weight:650;}
  .mst tr.k-res td{font-weight:750; color:var(--ink); background:#eef3f6;}
  .mst td.bc{background:#dfeaf1; color:var(--ink); font-weight:650;}
  .mst tr.k-res td.bc{background:#cfe0ea;}
  .mst td.neg{color:var(--bad);}
  .mst td.yc{color:var(--est); font-style:italic;}
  .mst th.bh{background:var(--blue);}
  .sc{font-size:13px;}
  .sc td{color:var(--ink2); white-space:normal; border-bottom:1px solid var(--line); vertical-align:top; padding:7px 12px;}
  .sc td b{color:var(--ink);}
  .sc td.n{font-weight:800; color:var(--mut); width:26px;}
  .arrow-up{color:var(--up); font-weight:800;} .arrow-watch{color:var(--warnc); font-weight:800;}
  .tagH,.tagP,.tagE{font-size:10px; font-weight:700; padding:1.5px 6px; border-radius:5px; vertical-align:1px; color:#fff;}
  .tagH{background:var(--hard);} .tagP{background:var(--partial);} .tagE{background:var(--est);}
  .mono{font-variant-numeric:tabular-nums;}
  #tip{position:fixed; z-index:50; pointer-events:none; background:#16181a; color:#fff;
    font-size:12px; line-height:1.4; padding:8px 11px; border-radius:6px; max-width:380px; opacity:0; transition:opacity .12s;}
  #tip.on{opacity:.97;}
  @media print{
    html{scroll-snap-type:none;}
    body{background:#fff;}
    nav.tabs{display:none;}
    .slidewrap{height:auto; padding-top:0; page-break-after:always; display:block;}
    .slidewrap:last-of-type{page-break-after:auto;}
    .panel,#hero{transform:none!important; box-shadow:none; margin:0 auto;}
    @page{size:1280px 720px; margin:0;}
  }
</style>

  const span=(ymax-ymin)||1; ymin=Math.max(0,ymin-span*ypad); ymax+=span*ypad;
  const ticks=niceTicks(ymin,ymax,5);
  ymin=Math.min(ymin,ticks[0]); ymax=Math.max(ymax,ticks[ticks.length-1]);
  const nx=cats.length+(series.some(s=>s.guide!=null)?1:0);
  const X=i=>P.l+i/(nx-1)*(W-P.l-P.r), Y=scaler(ymin,ymax,H-P.b,P.t);
  let g='';
  ticks.forEach(t=>{g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${P.l-8}" y="${Y(t)+4}" text-anchor="end">${yfmt(t)}</text>`;});

  series.forEach(s=>{
    let path='',prev=false;
    s.pts.forEach((v,i)=>{if(v==null){prev=false;return;} path+=(prev?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1); prev=true;});

  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%" role="img">${g}</svg>`;
}

/* ---- model detail table ---- */
function msFmt(f,v){
  if(v==null)return '–';
  if(f==='n0')return Math.round(v).toLocaleString('en-US');
  if(f==='n1')return v.toFixed(2);
  if(f==='pct')return v+'%';
  if(f==='usd1')return (v<0?'−$':'$')+Math.abs(v).toFixed(1);
  if(f==='usd2')return '$'+v.toFixed(2);
  return String(v);
}

/* ---- forward P/E panel (comp-dashboard grammar) ---- */
function peStats(tk){
  const p1=PE5Y.pe[tk].p1.filter(v=>v!=null);
  const avg=p1.reduce((s,v)=>s+v,0)/p1.length;
  const sd=Math.sqrt(p1.reduce((s,v)=>s+(v-avg)*(v-avg),0)/p1.length);
  const l1=[...PE5Y.pe[tk].p1].reverse().find(v=>v!=null), l2=[...PE5Y.pe[tk].p2].reverse().find(v=>v!=null);
  return {avg,sd,l1,l2};
}
function peFwdPanel(tk,W=565,H=194){
  const P={l:42,r:12,t:8,b:24};
  const D=PE5Y.dates, p1=PE5Y.pe[tk].p1, p2=PE5Y.pe[tk].p2;
  const {avg,sd,l1,l2}=peStats(tk);
  const vals=[...p1,...p2].filter(v=>v!=null).concat([avg+sd,avg-sd]);
  let ymin=Math.min(...vals), ymax=Math.max(...vals);
  const span=ymax-ymin; ymin=Math.max(0,ymin-span*.07); ymax+=span*.07;
  const X=scaler(0,D.length-1,P.l,W-P.r), Y=scaler(ymin,ymax,H-P.b,P.t);
  let g='';
  niceTicks(ymin,ymax,4).forEach(t=>{g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${P.l-6}" y="${Y(t)+3.5}" text-anchor="end" style="font-size:10.5px">${t}</text>`;});
  let py='';
  D.forEach((d,i)=>{const yy=d.slice(0,4); if(yy!==py&&d.slice(5,7)<='01'&&i>0||i===0){py=yy;
    if(+yy>2021) g+=`<text class="tick" x="${X(i)}" y="${H-P.b+16}" text-anchor="middle" style="font-size:10.5px">${yy}</text>`;}});
  /* sigma band + avg */
  [[avg+sd,'+1σ'],[avg-sd,'−1σ']].forEach(([v,lb])=>{
    g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--warnc)" stroke-width="1.4" stroke-dasharray="2 5" opacity=".75" data-tip="${esc(tk+' '+lb+': '+v.toFixed(1)+'x')}"/>`;});
  g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="7 5" opacity=".8" data-tip="${esc(tk+' média 5 anos (1Y fwd): '+avg.toFixed(1)+'x')}"/>`;
  const draw=(arr,col)=>{
    let path='',prev=false;
    arr.forEach((v,i)=>{if(v==null){prev=false;return;} path+=(prev?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1); prev=true;});
    g+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>`;};
  draw(p2,'var(--green)'); draw(p1,'var(--blue)');
  /* hover: sample every 4th week to keep DOM light */
  for(let i=0;i<D.length;i+=4){ if(p1[i]==null)continue;
    g+=`<circle cx="${X(i)}" cy="${Y(p1[i])}" r="8" fill="transparent" data-tip="${esc(tk+' — '+D[i]+': 1Y fwd '+p1[i].toFixed(1)+'x'+(p2[i]!=null?' · 2Y fwd '+p2[i].toFixed(1)+'x':''))}"/>`;}
  const head=`<div style="font-size:13px; margin-bottom:2px; padding-left:8px; border-left:3px solid var(--blue)"><b style="color:var(--gold)">${tk}</b><span style="color:var(--mut)"> — FORWARD P/E 5Y · </span><b style="color:var(--txt)">1Y ${l1.toFixed(1)}</b><span style="color:var(--mut)"> · 2Y ${l2.toFixed(1)} · 5Y AVG ${avg.toFixed(1)}</span></div>`;
  return `<div>${head}<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%" role="img">${g}</svg></div>`;
}

  const Y=scaler(Math.min(ymin,ticks[0]),Math.max(ymax,ticks[ticks.length-1]),H-P.b,P.t);
  const bandW=(W-P.l-P.r)/vals.length, barW=Math.max(6,bandW-3);
  let g='';
  ticks.forEach(t=>{g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${P.l-5}" y="${Y(t)+3}" text-anchor="end" style="font-size:9px">${yfmt(t)}</text>`;});
  resTicks().forEach((l,i)=>{if(l)g+=`<text class="tick" x="${P.l+bandW*(i+.5)}" y="${H-P.b+13}" text-anchor="middle" style="font-size:9px">${l}</text>`;});
  vals.forEach((x,i)=>{if(x==null)return;
    const y0=Y(Math.max(0,x)), h=Math.abs(Y(x)-Y(0));
    g+=`<rect x="${(P.l+bandW*i+(bandW-barW)/2).toFixed(1)}" y="${y0.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="1.5" fill="${col}" data-tip="${esc(H_RES.labels[i]+': '+yfmt(x)+(unit||''))}"/>`;});
  const li=vals.length-1;
  g+=`<text class="dl" x="${(P.l+bandW*(li+.5)).toFixed(1)}" y="${Y(vals[li])-5}" text-anchor="end" style="font-size:11px; fill:${col}">${yfmt(vals[li])}</text>`;
  g+=`<line class="bl" x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%" role="img">${g}</svg>`;
}
const pctF=v=>Math.round(v*100)+'%';
const bnF=v=>'$'+(Math.abs(v)>=1000?(v/1000).toFixed(0):(v/1000).toFixed(1))+'bn';

/* ---- stacked bars (generic, annual) ---- */
function stackedBars({cats,layers,W=740,H=420,ytick='$',ymaxPad=1.06,unit='B',totLabel=true}){
  const P={l:64,r:20,t:26,b:36};
  const totals=cats.map((_,i)=>layers.reduce((s,l)=>s+l.data[i],0));
  const ymax=Math.max(...totals)*ymaxPad;
  const Y=scaler(0,ymax,H-P.b,P.t);
  const bandW=(W-P.l-P.r)/cats.length, barW=Math.min(84,bandW-34);
  let g='';
  niceTicks(0,ymax,5).forEach(t=>{g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${P.l-8}" y="${Y(t)+4}" text-anchor="end">${ytick}${fmt0(t)}${unit}</text>`;});
  cats.forEach((c,i)=>{
    const x=P.l+bandW*i+(bandW-barW)/2;
    let y0=Y(0);
    layers.forEach(l=>{
      const v=l.data[i]; if(v<=0)return;
      const hpx=Y(0)-Y(v);
      y0-=hpx;
      g+=`<rect x="${x}" y="${y0.toFixed(1)}" width="${barW}" height="${Math.max(0,hpx-2).toFixed(1)}" rx="3" fill="${l.col}" data-tip="${esc(l.name+' — '+c+': '+ytick+fmt0(v)+unit+(l.tip?'\n'+l.tip:''))}"/>`;});
    if(totLabel)g+=`<text class="dl" x="${x+barW/2}" y="${Y(totals[i])-7}" text-anchor="middle">${ytick}${fmt0(totals[i])}${unit}</text>`;
    g+=`<text class="tick" x="${x+barW/2}" y="${H-P.b+20}" text-anchor="middle">${c}</text>`;});
  g+=`<line class="bl" x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%" role="img">${g}</svg>`;
}

/* ---- grouped bars: house vs casas ---- */
function houseVsBars({groups,series,W=1180,H=380,unit='B',ytick='$'}){
  const P={l:66,r:16,t:26,b:38};
  const vals=series.flatMap(s=>s.data).filter(v=>v!=null);
  const ymax=Math.max(...vals)*1.12;
  const Y=scaler(0,ymax,H-P.b,P.t);
  const bandW=(W-P.l-P.r)/groups.length;
  const ns=series.length, barW=Math.min(34,(bandW-46)/ns);
  let g='';
  niceTicks(0,ymax,5).forEach(t=>{g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${P.l-8}" y="${Y(t)+4}" text-anchor="end">${ytick}${fmt0(t)}${unit}</text>`;});
  groups.forEach((gname,gi)=>{
    g+=`<text class="tick" x="${P.l+bandW*(gi+0.5)}" y="${H-P.b+20}" text-anchor="middle" style="font-size:12.5px; font-weight:650">${gname}</text>`;
    series.forEach((s,si)=>{
      const v=s.data[gi]; if(v==null)return;
      const x=P.l+bandW*gi+(bandW-ns*barW-(ns-1)*3)/2+si*(barW+3);
      g+=`<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${barW}" height="${(Y(0)-Y(v)).toFixed(1)}" rx="3" fill="${s.col}" data-tip="${esc(s.name+' — '+gname+': '+ytick+fmt1(v)+unit)}"/>`;
      g+=`<text class="dl" x="${x+barW/2}" y="${Y(v)-5}" text-anchor="middle" style="font-size:10px">${Math.round(v)}</text>`;});
  });
  g+=`<line class="bl" x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%" role="img">${g}</svg>`;
}

/* ---- GW mini panel (house vs MS vs média) ---- */
function gwPanel(name,W=565,H=200){
  const d=H_GW[name], P={l:44,r:96,t:24,b:24};
  const vals=[...d.voce,...(d.ms||[]),...(d.media||[])].filter(v=>v!=null);
  const Y=scaler(0,Math.max(...vals)*1.1,H-P.b,P.t);
  const X=scaler(0,4,P.l,W-P.r);
  let g='';
  niceTicks(0,Math.max(...vals)*1.1,4).forEach(t=>{g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${P.l-6}" y="${Y(t)+3.5}" text-anchor="end" style="font-size:10.5px">${t}</text>`;});
  [2024,2025,2026,2027,2028].forEach((yy,i)=>{g+=`<text class="tick" x="${X(i)}" y="${H-P.b+16}" text-anchor="middle" style="font-size:10.5px">${yy}</text>`;});
  const draw=(arr,col,dash,lb)=>{
    let path='',prev=false;
    arr.forEach((v,i)=>{if(v==null){prev=false;return;} path+=(prev?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1); prev=true;});
    g+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="2.4" ${dash?'stroke-dasharray="5 5"':''}/>`;
    arr.forEach((v,i)=>{if(v==null)return; g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="8" fill="transparent" data-tip="${esc(name+' — '+lb+' '+(2024+i)+': '+fmt1(v)+' GW')}"/>`;});
  };
  draw(d.media,'var(--mut)',true,'média sell-side');
  if(d.ms)draw(d.ms,PET,false,'MS');
  draw(d.voce,ORG,false,'Capstone');
  const last=d.voce[4];
  g+=`<text class="dl" x="${X(4)+8}" y="${Y(last)+4}" style="fill:${ORG}">${fmt1(last)}</text>`;
  g+=`<text class="anno" x="${X(4)+8}" y="${Y(d.media[4])+4}">${fmt1(d.media[4])} média</text>`;
  g+=`<text x="${P.l}" y="14" style="font-size:13.5px; font-weight:750; fill:var(--ink)">${name}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%" role="img">${g}</svg>`;
}

const SECTIONS=[];
let SLIDE_SEQ=0;
function slide(title, bodyHtml, foot, opts={}){
  const id='sec'+(++SLIDE_SEQ);
  const m=title.match(/^(\S{1,3})\s*·\s*(.*)$/);
  const LBL={'1':'1 · LABS','2':'2 · TOKENS','3':'3 · CLOUDS','4':'4 · BACKLOG','5':'5 · MARGENS','6':'6 · TAM','7':'7 · CAPEX','8':'8 · MÚLTIPLO','9':'9 · TSM·ASML'};
  const lab=m?(LBL[m[1]]||m[1].toUpperCase()):(title.startsWith('Os nove')?'SCORECARD':title.split(/[:—]/)[0].trim().slice(0,10).toUpperCase());
  SECTIONS.push({id,lab});
  const [main,sub]=(m?m[2]:title).split(/ — |: /);
  return `<section class="panel" id="${id}"><h2>${m?m[1]+' · ':''}${main}${sub?`<span class="sub">— ${sub}</span>`:''}</h2>${bodyHtml}${foot?`<div class="note">${foot}</div>`:''}</section>`;
}

/* ============ MOUNT (dashboard page) ============ */
function mount(){
  document.getElementById('asof').textContent='as of 2026-08-03 · janela Fev→Jul 2026';
  const S=buildDeck();
  document.getElementById('page').innerHTML=S.join('')+
    `<footer class="pagefoot">Construído da wiki de research Capstone (transcripts primários, sell-side, expert calls, modelo house / AI Model via dashboards Oficiais) · consenso = Bloomberg BEst · ARR = run-rate estimado salvo declaração da empresa · bases de GW e backlog mantidas separadas · não é recomendação de investimento.</footer>`;
  const tabs=document.getElementById('tabs');
  tabs.innerHTML=SECTIONS.map(s=>`<a data-id="${s.id}">${s.lab}</a>`).join('');
  tabs.addEventListener('click',e=>{
    const a=e.target.closest('a'); if(!a)return;
    document.getElementById(a.dataset.id).scrollIntoView({behavior:'smooth',block:'start'});
  });
  const links=[...tabs.querySelectorAll('a')];
  const secs=SECTIONS.map(s=>document.getElementById(s.id));
  const spy=()=>{
    let best=0;
    secs.forEach((el,i)=>{if(el.getBoundingClientRect().top<=120)best=i;});
    links.forEach((a,i)=>a.classList.toggle('on',i===best));
  };
  addEventListener('scroll',spy,{passive:true}); spy();
}
const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]'); if(!t){tip.classList.remove('on');return;}
  tip.textContent=t.dataset.tip; tip.classList.add('on');});
document.addEventListener('mousemove',e=>{
  if(!tip.classList.contains('on'))return;
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(innerWidth-w-12,e.clientX+14)+'px';

<script>
/* ===== PPT shell: turn the dashboard panels into 16:9 slides ===== */
(function(){
  const page=document.getElementById('page');
  const slides=[...page.children].filter(el=>el.classList.contains('panel')||el.id==='hero');
  /* 1. split each panel into band (h2) + body + note */
  slides.forEach(el=>{
    if(el.id==='hero'){
      const img=document.createElement('img'); img.className='coverlogo';
      img.src='data:image/png;base64,'+CAPSTONE_LOGO; el.appendChild(img);
      const f=document.createElement('div'); f.className='coverfoot';
      f.textContent='Capstone · wiki de research — fontes (broker/analista ou fonte primária + data) em cada slide · dados até 03-ago-2026 · setas ↓ ↑ navegam · Ctrl+P exporta em PDF';
      el.appendChild(f);
      return;
    }
    const h2=el.querySelector(':scope>h2'), note=el.querySelector(':scope>.note');
    const body=document.createElement('div'); body.className='pbody';
    [...el.children].forEach(c=>{ if(c!==h2 && c!==note) body.appendChild(c); });
    el.insertBefore(body, note||null);
    if(h2){ const img=document.createElement('img'); img.className='slidelogo';
      img.src='data:image/png;base64,'+CAPSTONE_LOGO; h2.appendChild(img); }
  });
  /* 2. wrap each slide in a full-viewport snap cell + page numbers */
  slides.forEach((el,i)=>{
    const w=document.createElement('section'); w.className='slidewrap';
    page.insertBefore(w,el); w.appendChild(el);
    const n=document.createElement('div'); n.className='pageno';
    n.textContent=(i+1)+' / '+slides.length; el.appendChild(n);
  });
  /* 3. scale to viewport */
  const fit=()=>{ const sc=Math.min((innerWidth-36)/1280,(innerHeight-76)/720);
    slides.forEach(p=>p.style.setProperty('--sc',sc.toFixed(4))); };
  fit(); addEventListener('resize',fit);
  /* 4. keyboard nav */
  const wraps=[...document.querySelectorAll('.slidewrap')];
  const curIdx=()=>{ let b=0; wraps.forEach((w,i)=>{ if(w.getBoundingClientRect().top<=innerHeight*0.45) b=i; }); return b; };
  const go=i=>{ const t=wraps[Math.max(0,Math.min(wraps.length-1,i))]; if(t) t.scrollIntoView({behavior:'smooth',block:'center'}); };
  addEventListener('keydown',e=>{
    if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault(); go(curIdx()+1);}
    if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault(); go(curIdx()-1);}
    if(e.key==='Home'){e.preventDefault(); go(0);} if(e.key==='End'){e.preventDefault(); go(wraps.length-1);}
  });
})();
</script>
</body>
</html>
